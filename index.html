<style>
:root{
  --bg:#faf9f5;
  --topbar-dark:#f0ede8;
  --tab-shadow: rgba(112,103,81,0.38);
  --tab-shadow-blue: rgba(58,80,116,0.40);
  --white:#ffffff;
  --text:#242320;
  --text-muted:#9a9384;
  --date:#3b7dd8;
  --brand:#2658a1; /* azul notematic definitivo */
  --border:#e5e0d3;
  --shadow: 6px 8px 22px rgba(60,50,30,0.14);
  --shadow-soft: 3px 5px 10px rgba(60,50,30,0.22);
  --radius:16px;
  --topbar-h:58px;
  --tab-top-margin:9px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  overflow:hidden;
  font-size:15px;
}
img{-webkit-user-drag:none;user-select:none;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg);
}
.hidden{display:none !important;}

/* ── TOPBAR (pantalla principal) ── */
#topbar-wrap{
  position:relative;
  flex-shrink:0;
}
#topbar{
  position:relative;
  background:#dee6f1; /* azul Notematic al 15 % */
  height:calc(var(--topbar-h) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:flex-end;
  z-index:1;
}
#folder-tab-back{
  position:absolute;
  top:var(--tab-top-margin);
  left:0;
  width:calc(50% + 10px);
  height:calc(var(--topbar-h) - var(--tab-top-margin));
  background:var(--bg);
  border-radius:16px 16px 0 0;
  box-shadow: 5px 4px 10px var(--tab-shadow-blue);
  z-index:0;
}
#folder-tab{
  width:50%;
  height:calc(var(--topbar-h) - var(--tab-top-margin));
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 14px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:18px;
  color:var(--text);
  overflow:hidden;
  border-radius:16px 16px 0 0;
  box-shadow: 6px 7px 14px var(--tab-shadow-blue);
  position:relative;
  z-index:1;
}
#folder-name{color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#folder-count{
  font-weight:400;
  font-size:16px;
  color:var(--text-muted);
  flex-shrink:0;
}
#seam-mask{
  position:absolute;
  left:0;bottom:0;
  width:50%;
  height:18px;
  background:var(--bg);
  z-index:2;
}
#topbar-actions{
  position:absolute;
  right:0;top:0;bottom:0;
  width:50%;
  display:flex;align-items:center;justify-content:flex-start;
  gap:20px;
  padding:0 26px 0 34px;
  z-index:1;
}
#btn-menu{ margin-left:auto; }
.icon-btn{
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
#btn-plus{font-size:26px;font-weight:400;color:var(--text);line-height:1;width:30px;height:30px;}
#btn-folder img{
  height:26px;width:auto;
  display:block;
  filter:drop-shadow(2px 3px 2px var(--tab-shadow)) drop-shadow(2px 3px 2px var(--tab-shadow));
}
#btn-menu img{
  height:32px;width:auto;
  display:block;
  filter:drop-shadow(var(--shadow-soft));
}

/* ── LISTA DE NOTAS ── */
#notes-list{
  position:relative;
  z-index:3;
  background:var(--bg);
  flex:1;overflow-y:auto;
  padding:38px 20px 30px;
}
.note-card{
  padding:22px 2px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.note-card:last-child{border-bottom:none;}
.note-title{
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:17px;
  letter-spacing:normal;
  margin-bottom:8px;
  color:var(--text);
}
.note-body-row{
  display:flex;
  align-items:stretch;
  gap:12px;
}
.note-text-col{
  flex:1;
  min-width:0;
}
.note-thumb{
  /* El tamaño final (ancho=alto, igual a la altura del bloque de texto)
     se fija por JavaScript tras dibujar la lista (ver renderList). Un
     cuadrado fijo aquí es solo el valor de respaldo. Se usa una imagen de
     fondo (background-size:cover) en vez de un <img>: así no aparecen las
     líneas grises finas en los bordes que salían por redondeos de píxeles. */
  width:70px;
  height:70px;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  border-radius:10px;
  flex-shrink:0;
}
.note-preview{
  font-size:16px;
  line-height:1.5;
  color:var(--text);
  white-space:pre-wrap;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  margin-bottom:10px;
}
.note-date{
  font-size:13px;
  color:var(--brand);
}
.read-more{
  color:var(--text-muted);
  font-weight:600;
}
#empty-state{
  padding:60px 24px;
  text-align:center;
  color:var(--text-muted);
  font-size:15px;
  line-height:1.6;
}

/* ── EDITOR DE NOTA ── */
#editor-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  flex-shrink:0;
}
#btn-back{display:flex;align-items:center;color:var(--brand);padding:6px 10px;margin-left:-10px;}
#editor-header-actions{display:flex;align-items:center;gap:16px;}
#editor-header-actions #btn-cancel{font-size:15px;color:var(--text-muted);}
#editor-header-actions #btn-save{font-size:15px;color:var(--date);font-weight:600;}
#editor-body-wrap{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
  padding:8px 26px calc(20px + env(safe-area-inset-bottom,0px));
}
#note-title-input{
  width:100%;flex-shrink:0;
  border:none;background:none;outline:none;
  font-family:'Lora',serif;
  font-size:23px;
  font-weight:600;
  color:var(--text);
  margin-bottom:8px;
}
#note-title-input:empty:before{content:attr(data-placeholder);color:var(--text-muted);}
#note-title-input::placeholder{color:var(--text-muted);font-weight:500;}
#note-date-display{
  font-family:'Lora',serif;
  font-size:14px;
  color:var(--text-muted);
  margin-bottom:24px;
  display:block;
  flex-shrink:0;
}
#note-body-input{
  width:100%;flex:1;min-height:0;
  overflow-y:auto;
  outline:none;
  white-space:pre-wrap;
  word-wrap:break-word;
  font-family:'DM Sans',sans-serif;
  font-size:19px;
  line-height:1.55;
  color:var(--text);
  padding-bottom:160px;
}
#note-body-input:empty:before{content:attr(data-placeholder);color:var(--text-muted);}
#note-body-input a{color:var(--date);text-decoration:underline;}
#note-body-input .p-break-spacer{
  /* Espacio extra de "punto y aparte": un bloque con altura fija en
     píxeles (no depende del tamaño de letra ni de cómo cada navegador
     calcule la altura de una línea vacía, así el resultado es siempre
     el mismo). El ajuste de línea dentro del mismo párrafo no lleva esto. */
  display:block;
  height:10px;
}
#note-body-input img{
  display:block;
  width:92%;
  margin:14px auto;
  border-radius:14px;
  border:none;
  outline:none;
  /* El largo máximo es el doble del ancho de la imagen (92% del ancho
     disponible, aprox. 100vw menos el padding lateral del editor).
     Si la foto es más larga, se recorta (object-fit:cover) en vez de
     encogerla o dejarla desproporcionada. */
  max-height:calc(1.84 * (100vw - 52px));
  object-fit:cover;
}

/* ── IMÁGENES: descripción, ventanita y marco de selección ── */
#note-body-input figure.img-fig{display:block;width:92%;margin:14px auto;}
#note-body-input figure.img-fig img{width:100%;margin:0 auto;}
#note-body-input figure.img-fig figcaption{margin:8px 6px 0;text-align:center;font-size:14.5px;line-height:1.4;color:var(--text-muted);white-space:pre-wrap;}
#draw-overlay{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;}
#draw-overlay.hidden{display:none;}
#draw-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;color:var(--text);}
.draw-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.draw-ico:active{background:var(--topbar-dark);}
.draw-ico:disabled{opacity:.3;}
#draw-undoredo{display:flex;gap:4px;}
#draw-save{height:42px;padding:0 20px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;}
#draw-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px 130px;}
#draw-wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(60,50,30,.22);touch-action:none;}
#draw-wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;}
#draw-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--white);border-radius:18px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px;}
.draw-tool{position:relative;width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.draw-tool.on{background:var(--topbar-dark);}
.draw-cdot{position:absolute;right:7px;bottom:7px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.28);}
#draw-sub{position:absolute;z-index:4;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:9px 10px 7px;display:flex;flex-direction:column;align-items:stretch;gap:6px;}
#draw-sub.hidden{display:none;}
#draw-colors,#draw-spray-colors{display:flex;justify-content:space-between;align-items:center;padding:0 6px;}
#draw-spray-colors{justify-content:space-around;}
#draw-sub .draw-sw{width:28px;height:28px;flex:0 0 28px;}
#draw-sub .draw-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand);}
#draw-sub-row{display:flex;align-items:center;gap:6px;}
#draw-sizes{display:flex;gap:4px;align-items:center;justify-content:center;flex:1;}
#draw-sub .draw-sz{width:46px;height:40px;}
#draw-wrap canvas#draw-live,#draw-wrap canvas#draw-objs{pointer-events:none;}
#draw-bar,#draw-sub{z-index:4;}
#draw-bar.hidden{display:none;}
#draw-textbar{position:absolute;z-index:4;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:7px 8px;display:flex;align-items:center;gap:4px;}
#draw-textbar.hidden{display:none;}
#draw-text-colors{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
#draw-textbar .draw-sw{width:22px;height:22px;flex:0 0 22px;}
#draw-textbar .draw-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--brand);}
#draw-text-bold,#draw-text-alpha,#draw-tool-alpha{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
#draw-text-bold{font-family:'DM Sans',sans-serif;font-weight:600;font-size:19px;line-height:1;}
#draw-text-bold.on,#draw-text-alpha.on,#draw-tool-alpha.on{background:var(--topbar-dark);box-shadow:inset 0 0 0 2px var(--brand);}
#draw-alpha-pop{position:absolute;z-index:5;width:68px;height:250px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px + 46px + 8px);background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:12px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;touch-action:none;}
#draw-alpha-pop.hidden{display:none;}
#draw-alpha-val{font-size:15px;font-weight:600;color:var(--text);line-height:1;}
#draw-alpha-track{position:relative;flex:1;width:100%;margin:20px 0;touch-action:none;}
#draw-alpha-track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;border-radius:6px;background:rgba(0,0,0,.13);}
#draw-alpha-fill{position:absolute;left:50%;bottom:0;width:12px;margin-left:-6px;border-radius:6px;background:var(--brand);}
#draw-alpha-thumb{position:absolute;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.3);box-sizing:border-box;}
#draw-text-done,#draw-tool-done{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;}
.tb-sep{width:1px;height:22px;flex:0 0 1px;background:rgba(0,0,0,.14);}
.tc-row{display:flex;gap:14px;align-items:center;}
.draw-sz i.glyph{border-radius:0;background:none;font-style:normal;font-weight:700;line-height:1;color:var(--text);}
#draw-sel{position:absolute;z-index:3;border:2px dashed #fff;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;}
#draw-sel.hidden{display:none;}
#draw-sel button{position:absolute;width:32px;height:32px;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4);}
#draw-sel-del{left:-16px;top:-16px;background:#fff;color:#b5473a;}
#draw-sel-res{right:-16px;bottom:-16px;background:var(--brand);color:#fff;}
#draw-inline{position:absolute;z-index:2;margin:0;border:none;outline:none;resize:none;overflow:hidden;white-space:pre;background:transparent;font-family:'DM Sans',sans-serif;font-weight:600;text-align:center;box-sizing:border-box;border-radius:8px;user-select:text;-webkit-user-select:text;-webkit-appearance:none;}
#draw-inline.hidden{display:none;}

.draw-sw{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.2);}
.draw-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--brand);}
.draw-sz{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.draw-sz i{display:block;border-radius:50%;background:var(--text);}
.draw-sz.sel{background:var(--topbar-dark);box-shadow:inset 0 0 0 2px var(--brand);}
#draw-symbar{position:absolute;z-index:4;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:9px 10px 7px;display:flex;flex-direction:column;align-items:stretch;gap:6px;}
#draw-symbar.hidden{display:none;}
#draw-sym-colors{display:flex;justify-content:space-between;align-items:center;padding:0 6px;}
#draw-symbar .draw-sw{width:28px;height:28px;flex:0 0 28px;}
#draw-symbar .draw-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand);}
#draw-sym-row{display:flex;align-items:center;gap:6px;}
#draw-sym-list{flex:1;min-width:0;display:flex;gap:4px;align-items:center;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#draw-sym-list::-webkit-scrollbar{display:none;}
.sym-btn{flex:0 0 auto;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.sym-btn:active{background:var(--topbar-dark);}
.sym-btn.grp{width:auto;min-width:62px;padding:0 6px;height:50px;flex-direction:column;gap:1px;font-size:11px;font-weight:600;line-height:1;}
#draw-sym-alpha{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
#draw-sym-alpha.on{background:var(--topbar-dark);box-shadow:inset 0 0 0 2px var(--brand);}
#draw-sym-done{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;}

.draw-sw[data-c="#ffffff"]{border:1.5px solid #1b1a18;}
.draw-cdot[style*="255, 255, 255"],.draw-cdot[style*="#ffffff"]{box-shadow:0 0 0 1.5px #1b1a18;}
#draw-confirm{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5;}
#draw-confirm.hidden{display:none;}
.draw-confirm-box{background:var(--white);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 14px;width:min(300px,84vw);}
.draw-confirm-box p{font-size:17px;color:var(--text);margin-bottom:14px;}
.draw-confirm-box .row{display:flex;justify-content:flex-end;gap:6px;}
.draw-confirm-box button{padding:10px 14px;border-radius:10px;font-size:16px;font-weight:600;color:var(--text-muted);}
.draw-confirm-box button.go{color:var(--brand);}
#img-ring{position:fixed;pointer-events:none;border:2.5px solid var(--brand);border-radius:17px;z-index:205;}
#img-pop{position:fixed;z-index:210;background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;gap:2px;}
#img-pop button{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);}
#img-pop button:active{background:var(--topbar-dark);}
#img-pop button.danger{color:#b5473a;}
#img-ring.hidden,#img-pop.hidden{display:none;}
#modal-imgcap{align-items:flex-start;padding-top:12vh;}
.cap-input{width:100%;resize:none;display:block;line-height:1.4;}
.cap-swatches{display:flex;gap:14px;margin:16px 0 2px;}
.cap-swatch{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(60,50,30,0.14);}
.cap-swatch.active{box-shadow:inset 0 0 0 1px rgba(60,50,30,0.14),0 0 0 2px var(--white),0 0 0 3.5px var(--text);}
#editor-toolbar{
  position:relative;
  flex-shrink:0;
  display:block;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
  background:var(--bg);
}
/* Los botones van en una tira que se desliza con el dedo hacia la izquierda;
   las ventanitas quedan fuera de la tira para que no se recorten. */
#tb-scroll{
  display:flex;align-items:center;gap:4px;
  padding:0 20px;
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
}
#tb-scroll::-webkit-scrollbar{display:none;}
#tb-scroll::after{content:"";flex:0 0 1px;}
#editor-toolbar.hidden{display:none;}
#editor-toolbar .fmt-btn{
  flex:0 0 auto;
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--text);
  border-radius:10px;
}
#editor-toolbar .fmt-btn.active{
  background:var(--topbar-dark);
  color:var(--date);
}


/* ── BLOQUES DE PÁRRAFO (estilo y alineación) ── */
#note-body-input .p{margin:0 0 10px;min-height:1.55em;position:relative;}
#note-body-input .p[data-a="center"]{text-align:center;}
#note-body-input .p[data-a="right"]{text-align:right;}
#note-body-input .p[data-t]{padding-left:30px;}
#note-body-input > :not([data-t="num"]){counter-reset:n;}
#note-body-input .p[data-t="num"]{counter-increment:n;}
#note-body-input .p[data-t]::before{position:absolute;left:0;top:0;text-align:left;}
#note-body-input .p[data-t="bullet"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text);top:11px;left:9px;}
#note-body-input .p[data-t="num"]::before{content:counter(n) ".";width:24px;color:var(--text-muted);}
#note-body-input .p[data-t="check"]::before{content:"";box-sizing:border-box;width:20px;height:20px;top:5px;left:1px;border:1.6px solid var(--text-muted);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:#fff;}
#note-body-input .p[data-t="check"][data-done]::before{content:"\2713";background:var(--brand);border-color:var(--brand);}
#note-body-input .p[data-t="check"][data-done]{color:var(--text-muted);text-decoration:line-through;}
.fmt-pop{position:absolute;bottom:calc(100% + 8px);background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;gap:2px;z-index:210;}
.fmt-pop.hidden{display:none;}
#editor-toolbar .fmt-btn.dim{opacity:.35;}
.ico-aa{display:flex;align-items:baseline;gap:1px;font-family:'DM Sans',sans-serif;font-weight:700;line-height:1;}
.ico-aa span:first-child{font-size:22px;}
.ico-aa span:last-child{font-size:15px;}
#note-body-input{--bf:19px;}
#note-body-input font[size="1"]{font-size:calc(var(--bf) * .7);}
#note-body-input font[size="2"]{font-size:calc(var(--bf) * .85);}
#note-body-input font[size="3"]{font-size:var(--bf);}
#note-body-input font[size="4"]{font-size:calc(var(--bf) * 1.15);}
#note-body-input font[size="5"]{font-size:calc(var(--bf) * 1.4);}
#note-body-input font[size="6"]{font-size:calc(var(--bf) * 1.8);}
#note-body-input font[size="7"]{font-size:calc(var(--bf) * 2.3);}
.fmt-pop .sz-btn{font-family:'DM Sans',sans-serif;font-weight:700;line-height:1;}
.fmt-pop .hl-swatch{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
.fmt-pop .hl-swatch i{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(60,50,30,0.14);}
.fmt-pop .hl-swatch.active{background:var(--topbar-dark);}
.fmt-pop .hl-swatch.active i{box-shadow:inset 0 0 0 1px rgba(60,50,30,0.14),0 0 0 2px var(--white),0 0 0 3.5px var(--text);}
#note-body-input span[style*="background-color"]{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
.fmt-pop button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text);font-size:16px;}
.fmt-pop button.active{background:var(--topbar-dark);color:var(--date);}

#camera-overlay{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;}
#camera-overlay.hidden{display:none;}
#camera-video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000;}
#camera-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;padding:18px 0 calc(22px + env(safe-area-inset-bottom,0px));}
#camera-shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:none;padding:0;position:relative;}
#camera-shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;}
#camera-shutter:active::after{background:#ccc;}
#camera-close{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:44px;height:44px;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;}


/* ── NOTA DESTACADA ── */
.note-card.featured{
  position:relative;
  margin:0 0 22px;
  padding:18px 18px 16px;
  background:#eef2f7;
  border:none;
  border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(22,38,66,0.30),0 6px 16px rgba(22,38,66,0.30);
}
.note-card.featured .note-title{padding-right:30px;}
.note-card.featured .feat-pin-btn{
  position:absolute;top:4px;right:4px;
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  color:var(--brand);
}
.feat-pin-btn svg,#editor-pin svg{width:20.4px;height:20.4px;display:block;}
#editor-body-wrap{position:relative;}
#editor-pin{
  position:absolute;top:3px;right:20px;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  color:var(--brand);z-index:2;
}
#editor-pin.hidden{display:none;}
#note-title-input.has-pin{padding-right:46px;}
#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:#2b2a27;color:#fff;
  padding:12px 12px 12px 18px;border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.28);
  display:flex;align-items:center;gap:14px;
  font-size:15px;z-index:250;max-width:calc(100vw - 32px);
  transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
#toast button{color:#9fc1f2;font-weight:700;font-size:15px;padding:4px 8px;}

/* ── VENTANAS FLOTANTES (MODALES) ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(30,28,22,0.28);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  padding:24px;
}
.modal-box{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  width:100%;max-width:380px;
  padding:26px 24px;
  max-height:80vh;
  display:flex;flex-direction:column;
}
#modal-image-source .modal-box{
  width:150px;max-width:150px;
  padding:20px 14px;
}
#modal-image-source .menu-option{
  text-align:center;
}
.modal-title{
  font-family:'Lora',serif;
  font-size:20px;font-weight:600;
  margin-bottom:16px;
  color:var(--text);
}
.modal-subtitle{
  font-size:14px;color:var(--text-muted);
  margin:-8px 0 16px;line-height:1.5;
}
.new-folder-row{
  display:flex;gap:10px;margin-bottom:18px;flex-shrink:0;
}
.new-folder-input{
  flex:1;padding:11px 14px;
  border:1px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;color:var(--text);
}
.new-folder-input:focus{border-color:var(--date);}
.new-folder-add{
  background:var(--brand);color:#fff;
  padding:0 18px;border-radius:10px;
  font-size:15px;font-weight:600;
}
.folder-chips{
  display:flex;flex-wrap:wrap;gap:10px;
  overflow-y:auto;
}
.folder-chip{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;
  border-radius:20px;
  background:var(--bg);
  border:1px solid var(--border);
  font-size:15px;color:var(--text);
  cursor:pointer;
}
.folder-chip.active{
  background:var(--topbar-dark);
  border-color:var(--topbar-dark);
  font-weight:600;
}
.folder-chip .chip-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.move-chips{
  flex-direction:column;flex-wrap:nowrap;align-items:stretch;
  gap:8px;margin-bottom:16px;
}
.move-chips .folder-chip{justify-content:flex-start;flex-shrink:0;}
.move-chips .chip-name{max-width:none;}
#btn-menu-editor{margin-right:8px;}
/* ── Reproductor de audio dentro de la nota ── */
#note-body-input .audio-clip{
  display:flex;align-items:center;gap:12px;
  width:92%;height:54px;margin:14px auto;padding:0 14px;box-sizing:border-box;
  border-radius:14px;background:rgba(38,88,161,.09);
  user-select:none;-webkit-user-select:none;
}
.audio-play{
  position:relative;flex-shrink:0;width:36px;height:36px;
  border-radius:50%;background:var(--brand);border:none;padding:0;
}
.audio-play::before{
  content:"";position:absolute;left:50%;top:50%;margin:-7px 0 0 -4px;
  border-style:solid;border-width:7px 0 7px 12px;
  border-color:transparent transparent transparent #fff;
}
.audio-clip.playing .audio-play::before{
  border:none;width:12px;height:14px;margin:-7px 0 0 -6px;
  background:linear-gradient(90deg,#fff 0 4px,transparent 4px 8px,#fff 8px 12px);
}
.audio-bar{flex:1;height:4px;border-radius:2px;background:rgba(38,88,161,.22);overflow:hidden;}
.audio-fill{height:100%;width:0;background:var(--brand);}
.audio-time{min-width:38px;text-align:right;font-size:14px;color:var(--brand);font-variant-numeric:tabular-nums;}
.audio-time::before{content:attr(data-t);} /* el tiempo va como contenido generado: no se cuela en el texto de la nota */
/* ── Ventana de grabación ── */
#modal-record .modal-box{width:230px;max-width:230px;align-items:center;padding:24px 20px;}
.record-row{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
  font-size:24px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;
}
.record-dot{width:12px;height:12px;border-radius:50%;background:#d64545;animation:recpulse 1s infinite;}
@keyframes recpulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.record-actions{display:flex;gap:24px;}
.record-btn{
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
#record-cancel{background:#eceae4;color:var(--text-muted);}
#record-stop{background:var(--brand);}
#record-stop::before{content:"";width:16px;height:16px;background:#fff;border-radius:3px;}
#folder-chips .chip-name{flex:1;}
#folder-chips .chip-action{font-size:16px;padding:4px 8px;}
.chip-action{
  font-size:12px;color:var(--text-muted);
  padding:2px 4px;
}
.chip-action:hover{color:var(--text);}
.modal-actions-row{
  margin-top:20px;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.modal-link-btn{
  font-size:15px;color:var(--text-muted);font-weight:600;
}
.menu-option{
  padding:13px 6px;
  font-size:16px;
  color:var(--text);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  text-align:left;
}
.menu-option:last-child{border-bottom:none;}
.menu-option.danger{color:#b5473a;}
.search-result{
  padding:12px 4px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.search-result:last-child{border-bottom:none;}
.search-result-title{font-weight:700;font-size:16px;color:var(--text);}
.trash-row{padding:12px 4px;border-bottom:1px solid var(--border);}
.trash-row:last-child{border-bottom:none;}
.trash-title{font-weight:700;font-size:16px;color:var(--text);}
.trash-meta{font-size:13px;color:var(--text-muted);margin-top:2px;}
.trash-actions{display:flex;gap:8px;margin-top:10px;}
.trash-btn{font-size:14px;font-weight:600;padding:7px 14px;border-radius:9px;background:var(--topbar-dark);color:var(--text);}
.trash-btn.danger{color:#b5473a;}
.search-result-folder{font-size:13px;color:var(--text-muted);margin-top:2px;}
</style>
</head>
<body>

<!-- ═══════ PANTALLA 1: LISTA DE NOTAS ═══════ -->
<div id="screen-list" class="screen">
  <div id="topbar-wrap">
  <div id="topbar">
    <div id="folder-tab-back"></div>
    <div id="folder-tab">
      <span id="folder-name">Todas</span>
      <span id="folder-count">0</span>
    </div>
    <div id="topbar-actions">

<!-- ═══════ MODAL: ORIGEN DE LA IMAGEN (galería o cámara) ═══════ -->
<!-- Sin título ni botón de cancelar: tocar fuera de la ventanita la cierra. -->
<div class="modal-overlay hidden" id="modal-image-source">
  <div class="modal-box">
    <div id="image-source-options" style="display:flex;flex-direction:column;gap:2px;">
      <div class="menu-option" id="image-source-gallery">Galería</div>
      <div class="menu-option" id="image-source-camera">Cámara</div>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: GRABANDO AUDIO ═══════ -->
<!-- Tocar fuera NO cierra (para no perder una grabación por error). -->
<div class="modal-overlay hidden" id="modal-record">
  <div class="modal-box">
    <div class="record-row"><span class="record-dot"></span><span id="record-time">0:00</span></div>
    <div class="record-actions">
      <button type="button" class="record-btn" id="record-cancel" aria-label="Descartar grabación">&#10005;</button>
      <button type="button" class="record-btn" id="record-stop" aria-label="Terminar grabación"></button>
    </div>
  </div>
</div>

<div id="camera-overlay" class="hidden">
  <video id="camera-video" playsinline muted autoplay></video>
  <div id="camera-bar">
    <button id="camera-close" aria-label="Cerrar cámara">&#10005;</button>
    <button id="camera-shutter" aria-label="Hacer foto"></button>
  </div>
</div>
<input type="file" id="image-insert-gallery" accept="image/*" style="display:none;"/>
<input type="file" id="image-insert-camera" accept="image/*" capture="environment" style="display:none;"/>
<input type="file" id="audio-system-input" accept="audio/*" capture style="display:none;"/>

<!-- ═══════ MODAL: ELEGIR/GESTIONAR CARPETAS (uso general, desde icono carpeta) ═══════ -->
<!-- Sin botón "Cerrar": tocar fuera de la ventana la cierra. -->
<div class="modal-overlay hidden" id="modal-folders">
  <div class="modal-box">
    <div class="modal-title">Carpetas</div>
    <div class="folder-chips move-chips" id="folder-chips"></div>
    <div class="new-folder-row" style="margin-bottom:0;">
      <input class="new-folder-input" id="new-folder-input" type="text" placeholder="Nueva carpeta..."/>
      <button class="new-folder-add" id="new-folder-add">Crear</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: AVISO AL SALIR DE UNA NOTA CON CAMBIOS ═══════ -->
<!-- Tocar fuera de la ventanita la cierra y se sigue en la nota. -->
<div class="modal-overlay hidden" id="modal-save-pick">
  <div class="modal-box">
    <div class="modal-title">¿Guardar los cambios?</div>
    <div class="modal-actions-row">
      <button class="modal-link-btn" id="save-pick-discard">Descartar</button>
      <button class="modal-link-btn" id="save-pick-direct" style="font-weight:700;color:var(--brand);">Guardar</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: MOVER NOTA A UNA CARPETA (desde el menú de la N del editor) ═══════ -->
<!-- Sin botones: tocar una carpeta guarda y sale; tocar fuera cancela. -->
<div class="modal-overlay hidden" id="modal-move">
  <div class="modal-box">
    <div class="modal-title">Carpetas</div>
    <div class="folder-chips move-chips" id="move-chips"></div>
    <div class="new-folder-row" style="margin-bottom:0;">
      <input class="new-folder-input" id="move-new-input" type="text" placeholder="Nueva carpeta..."/>
      <button class="new-folder-add" id="move-new-add">Crear</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: MENÚ (icono cuaderno, contenido distinto según contexto) ═══════ -->
<div class="modal-overlay hidden" id="modal-menu">
  <div class="modal-box">
    <div id="menu-options" style="display:flex;flex-direction:column;gap:2px;"></div>
  </div>
</div>

<!-- ═══════ MODAL: BUSCAR ═══════ -->
<div class="modal-overlay hidden" id="modal-search">
  <div class="modal-box">
    <div class="modal-title">Buscar</div>
    <div class="new-folder-row">
      <input class="new-folder-input" id="search-input" type="text" placeholder="Escribe una o varias palabras..."/>

<script>
(function(){
  "use strict";


  var STORAGE_KEY = "onlyNotesData";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ── ALMACENAMIENTO: IndexedDB (antes localStorage) ──
  // Se guarda todo el objeto de datos bajo una única clave, igual que antes
  // en localStorage, pero en una base de datos con mucho más espacio, para
  // poder incrustar imágenes y audio en las notas.
  var IDB_NAME = "NotematicDB";
  var IDB_STORE = "kv";
  var AUDIO_STORE = "audio";
  var idbPromise = null;
  function openIDB(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(IDB_NAME, 2);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        // v2: las grabaciones de voz se guardan como archivos independientes
        if(!db.objectStoreNames.contains(AUDIO_STORE)) db.createObjectStore(AUDIO_STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e.target.error); };
    });
    return idbPromise;
  }
  function idbGet(key){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbSet(key, value){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  // Operaciones genéricas sobre cualquier almacén (usadas para el audio)
  function idbStoreGet(store, key){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var req = db.transaction(store, "readonly").objectStore(store).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbStorePut(store, key, value){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, "readwrite");
        tx.objectStore(store).put(value, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbStoreKeys(store){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var req = db.transaction(store, "readonly").objectStore(store).getAllKeys();
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbStoreDelete(store, key){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(store, "readwrite");
        tx.objectStore(store).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function defaultData(){
    var defaultFolders = [
      {id: uid(), name: "Todas", isAll: true},
      {id: uid(), name: "Carpeta 1"}
    ];
    return {
      folders: defaultFolders,
      notes: [],
      trash: [],
      currentFolderId: defaultFolders[0].id
    };
  }

  // Devuelve una Promise con los datos: primero mira en IndexedDB; si está
  // vacía (primera vez tras la actualización), migra lo que hubiera en
  // localStorage; si tampoco hay nada, crea los datos por defecto.
  function loadData(){
    return idbGet(STORAGE_KEY).then(function(fromDB){
      if(fromDB){
        if(!fromDB.folders.some(function(f){ return f.isAll; })){
          fromDB.folders[0].isAll = true;
        }
        // La carpeta especial que agrupa todas las notas pasa de llamarse
        // "Notas" a "Todas" (solo si conserva el nombre original).
        var renamed = false;
        fromDB.folders.forEach(function(f){
          if(f.isAll && f.name === "Notas"){ f.name = "Todas"; renamed = true; }
        });
        if(renamed) idbSet(STORAGE_KEY, fromDB);
        return fromDB;
      }
      var raw = null;
      try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
      if(raw){
        try{
          var parsed = JSON.parse(raw);
          if(!parsed.folders.some(function(f){ return f.isAll; })){
            parsed.folders[0].isAll = true;
          }
          parsed.folders.forEach(function(f){
            if(f.isAll && f.name === "Notas") f.name = "Todas";
          });
          return idbSet(STORAGE_KEY, parsed).then(function(){ return parsed; });
        }catch(e){}
      }
      var fresh = defaultData();
      return idbSet(STORAGE_KEY, fresh).then(function(){ return fresh; });
    });
  }

  var data; // se asigna de forma asíncrona antes del primer renderList()
  var pendingFeature = null; // destacar/quitar en una nota nueva aún sin guardar
  // ── NOTA DESTACADA: chincheta en el editor, menú y aviso con "Deshacer" ──
  var featPinSession = false; // la chincheta se muestra si la nota era destacada al abrirla o si se ha tocado en esta sesión
  function pinSvg(crossed){
    var x = '';
    var pc = crossed ? '#cdcac2' : 'currentColor';
    return '<svg viewBox="-2 -2 28 28" aria-hidden="true"><g transform="rotate(35 12 12)" fill="' + pc + '" stroke="' + pc + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v6"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2v.8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></g>' + x + '</svg>';
  }
  function hasFeaturedNote(){
    return !!data.featuredId && data.notes.some(function(n){ return n.id === data.featuredId; });
  }
  function isFeaturedNow(){
    return pendingFeature !== null ? pendingFeature : (!!editingNoteId && data.featuredId === editingNoteId);
  }
  function updateEditorPin(){
    var btn = document.getElementById("editor-pin");
    var f = isFeaturedNow();
    // Se ve en esta nota si ella es la destacada o si no hay ninguna destacada.
    var vis = f || !hasFeaturedNote();
    btn.classList.toggle("hidden", !vis);
    titleInput.classList.toggle("has-pin", vis);
    if(!vis) return;
    btn.innerHTML = pinSvg(!f);
    btn.setAttribute("aria-label", f ? "Quitar de destacada" : "Destacar esta nota");
  }
  function setFeaturedNow(want){
    if(editingNoteId){
      if(want) data.featuredId = editingNoteId;
      else if(data.featuredId === editingNoteId) data.featuredId = null;
      saveData();
    } else {
      pendingFeature = want;
    }
    featPinSession = true;
    updateEditorPin();
  }
  document.getElementById("editor-pin").addEventListener("pointerdown", function(e){ e.preventDefault(); });
  document.getElementById("editor-pin").addEventListener("click", function(){ setFeaturedNow(!isFeaturedNow()); });

  var toastTimer = null;
  function showToast(msg, label, fn){
    var t = document.getElementById("toast"), b = document.getElementById("toast-action");
    document.getElementById("toast-msg").textContent = msg;
    b.classList.toggle("hidden", !label);
    b.textContent = label || "";
    b.onclick = function(){ t.classList.remove("show"); if(fn) fn(); };
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 7500);
  }
  function unfeatureFromList(id){
    data.featuredId = null;
    saveData();
    renderList();
    showToast("Nota quitada de destacadas", "Deshacer", function(){
      data.featuredId = id;

  function renderList(){
    var folder = currentFolder();

    // Nota destacada: una sola, visible arriba en todas las carpetas.
    var featuredNote = data.featuredId ? data.notes.find(function(n){ return n.id === data.featuredId; }) : null;
    if(featuredNote) notes = notes.filter(function(n){ return n.id !== featuredNote.id; });
    folderNameEl.textContent = folder.name;
    folderCountEl.textContent = notes.length + (featuredNote ? 1 : 0);

    notesListEl.innerHTML = "";
    if(notes.length === 0 && !featuredNote){
      var empty = document.createElement("div");
      empty.id = "empty-state";
      empty.textContent = "No hay notas en esta carpeta todavía. Pulsa + para crear la primera.";
      notesListEl.appendChild(empty);
      return;
    }
    (featuredNote ? [featuredNote] : []).concat(notes).forEach(function(note, idx){
      var isFeat = !!featuredNote && idx === 0;
      var card = document.createElement("div");
      card.className = "note-card" + (isFeat ? " featured" : "");
      var title = note.title && note.title.trim() ? note.title : "Sin título";
      var rawPreview = (note.body || "").trim();
      var flatPreview = rawPreview.replace(/\s+/g, " ");
      var CHAR_LIMIT = 118;
      var isLong = flatPreview.length > CHAR_LIMIT;
      var previewHtml;
      if(isLong){
        var cut = flatPreview.slice(0, CHAR_LIMIT);
        var lastSpace = cut.lastIndexOf(" ");
        if(lastSpace > 60) cut = cut.slice(0, lastSpace);
        previewHtml = escapeHtml(cut) + '… <span class="read-more">Leer más</span>';
      } else {
        previewHtml = escapeHtml(flatPreview);
      }
      var thumbMatch = note.bodyHtml ? note.bodyHtml.match(/<img[^>]+src="([^"]+)"/i) : null;
      var thumbHtml = thumbMatch ? '<div class="note-thumb" style="background-image:url(\'' + thumbMatch[1] + '\')"></div>' : "";
      card.innerHTML =
        (isFeat ? '<button class="feat-pin-btn" aria-label="Quitar de destacada">' + pinSvg(false) + '</button>' : '') +
        '<div class="note-title">' + escapeHtml(title) + '</div>' +
        '<div class="note-body-row">' +
          '<div class="note-text-col">' +
            '<div class="note-preview">' + previewHtml + '</div>' +
            '<div class="note-date">' + formatDate(note.updatedAt) + '</div>' +
          '</div>' +

          e.stopPropagation();

    // que ocupa el texto (vista previa + fecha) de cada tarjeta y se aplica
    // como ancho y alto de su miniatura, ya que depender solo de CSS
    // (aspect-ratio + stretch de flexbox) no daba un resultado fiable.
    requestAnimationFrame(function(){
      var thumbs = notesListEl.querySelectorAll(".note-thumb");
      for(var i = 0; i < thumbs.length; i++){
        var thumb = thumbs[i];
        var textCol = thumb.previousElementSibling;

          if(h > 0){
            thumb.style.width = h + "px";
            thumb.style.height = h + "px";
          }
        }
      }
    });
  }

  // ── ROTULADOR (resaltado de texto en tres colores) ──
  function rgbToHex(rgb){
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb || "");
    if(!m) return "";
    return "#" + [m[1], m[2], m[3]].map(function(n){ return ("0" + parseInt(n, 10).toString(16)).slice(-2); }).join("");
  }

  var camOverlay = document.getElementById("camera-overlay");
  var camVideo = document.getElementById("camera-video");
  var camStream = null;
  function stopCamera(){
    if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }

  document.getElementById("camera-shutter").addEventListener("click", function(){

    var sc = Math.min(1, 1920 / Math.max(w, h));

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  // Las fotos de la galería se reducen a un máximo de 1600 px por el lado largo:
  // se ven igual en el móvil y pesan mucho menos al guardarlas y copiarlas.
  function shrinkImage(file){
    if(/gif|svg/.test(file.type)) return readFileAsDataUrl(file);
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        URL.revokeObjectURL(url);
        var w = im.naturalWidth, h = im.naturalHeight, sc = Math.min(1, 1600 / Math.max(w, h));
        if(sc === 1 && file.size < 400000){ readFileAsDataUrl(file).then(resolve, reject); return; }
        var cv = document.createElement("canvas");
        cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
        var ctx = cv.getContext("2d");
        var keepAlpha = /png|webp/.test(file.type);
        if(!keepAlpha){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        resolve(keepAlpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.85));
      };
      im.onerror = function(){ URL.revokeObjectURL(url); readFileAsDataUrl(file).then(resolve, reject); };
      im.src = url;
    });
  }
  function insertImageFile(file, fromCam){
    if(!file) return;
    shrinkImage(file).then(function(src){ insertImageSrc(src, fromCam); }).catch(function(){
      alert("No se pudo leer la imagen. Prueba con otra.");
    });
  }
  function insertImageSrc(src, fromCam){
    bodyInput.focus();
    var sel = window.getSelection();
    sel.removeAllRanges();
    if(savedBodyRange){
      sel.addRange(savedBodyRange);
    } else {
      var r0 = document.createRange();
      r0.selectNodeContents(bodyInput);
      r0.collapse(false);
      sel.addRange(r0);
    }
    wrapLoose();
    var range = sel.rangeCount ? sel.getRangeAt(0) : null;
    if(range) range.deleteContents();
    // contenteditable="false": evita el borde/tiradores nativos de Chrome en imágenes
    var img = document.createElement("img");
    img.src = src;
    img.setAttribute("contenteditable", "false");
    var fig = document.createElement("figure");
    fig.className = "img-fig"; fig.setAttribute("contenteditable", "false");
    if(fromCam) fig.setAttribute("data-cam", "1");   // foto que aún no está en la galería del móvil
    fig.appendChild(img);
    var blk = range ? topBlock(range.startContainer) : null;
    if(!blk){
      var last = bodyInput.lastElementChild;
      if(last && isPlainBlock(last) && blockIsEmpty(last)) blk = last;
    }
    var after;                         // párrafo donde queda el cursor, debajo de la imagen
    if(!blk){
      bodyInput.appendChild(fig);
      after = newBlock(); after.innerHTML = "<br>"; bodyInput.appendChild(after);
    } else if(!isPlainBlock(blk)){     // al lado de un audio u otra imagen
      after = newBlock(); after.innerHTML = "<br>";
      insertAfterNode(blk, fig); insertAfterNode(fig, after);
    } else if(blockIsEmpty(blk)){      // línea vacía: la imagen ocupa su sitio y esa línea queda debajo
      blk.parentNode.insertBefore(fig, blk);
      blk.removeAttribute("data-t"); blk.removeAttribute("data-done");
      if(!blk.firstChild) blk.innerHTML = "<br>";
      after = blk;

  var playCtx = null;

  function softClipCurve(){
    var n = 2048, c = new Float32Array(n), knee = 0.7, room = 1 - knee;
    for(var i = 0; i < n; i++){
      var x = (i / (n - 1)) * 2 - 1, ax = Math.abs(x);
      var y = ax <= knee ? ax : knee + room * Math.tanh((ax - knee) / room);
      c[i] = x < 0 ? -y : y;

  function measureGainDb(blob){
    return blob.arrayBuffer().then(function(buf){
      return new Promise(function(res, rej){ getPlayCtx().decodeAudioData(buf, res, rej); });

      var sr = ab.sampleRate, fr = Math.max(1, Math.round(0.05 * sr)), chs = [];
      for(var c = 0; c < ab.numberOfChannels; c++) chs.push(ab.getChannelData(c));
      var levels = [], maxDb = -200;
      for(var i = 0; i + fr <= ab.length; i += fr){
        var sum = 0;
        for(var k = 0; k < fr; k++){
          var v = 0;
          for(var c2 = 0; c2 < chs.length; c2++) v += chs[c2][i + k];
          v /= chs.length;

  // Procesado de la voz antes de grabarla (Web Audio). Cadena revisada tras
  // analizar una grabación real: sin realce de agudos (el micro casi no tiene
  // nada por encima de 9 kHz), compresión suave, reductor de "s" y "ch",
  // volumen final normal y salida en mono. Si algo falla, se graba sin procesar.
  // Nota: el compresor del navegador sube solo el volumen para compensar
  // ("makeup" automático); dyn() lo anula para controlar el nivel a mano.
  function buildVoiceChain(ctx, stream){
    function bq(type, f, q, g){
      var n = ctx.createBiquadFilter();
      n.type = type; n.frequency.value = f;
      if(q != null) n.Q.value = q;
      if(g != null) n.gain.value = g;

    }
    function dyn(th, knee, ratio, att, rel){
      var c = ctx.createDynamicsCompressor();
      c.threshold.value = th; c.knee.value = knee; c.ratio.value = ratio;
      c.attack.value = att; c.release.value = rel;
      var g = ctx.createGain();
      var kt = th + knee;                       // fin de la zona suave
      g.gain.value = Math.pow(10, (0.6 * (kt + (-kt) / ratio)) / 20);
      c.connect(g);
      return {input: c, output: g};
    }
    var src = ctx.createMediaStreamSource(stream);
    var hp = bq("highpass", 90, 0.7);              // corta ruido/golpes graves
    var lev = ctx.createGain();                    // nivelador automático (ver abajo)
    var an = ctx.createAnalyser(); an.fftSize = 2048;
    var low = bq("lowshelf", 250, null, -3);       // menos "cuerpo" grave
    var pres = bq("peaking", 3000, 0.8, 2.5);      // claridad de la voz
    var lp = bq("lowpass", 9500, 0.7);             // sin agudos donde solo hay ruido
    // Reductor de "s" y "ch": se separa la señal en dos bandas (cruce a 4500 Hz)
    // y solo la banda aguda pasa por un compresor rápido.
    var dl = ctx.createDelay(0.05); dl.delayTime.value = 0.006; // compensa el retardo del compresor
    var lo1 = bq("lowpass", 4500, 0.7071), lo2 = bq("lowpass", 4500, 0.7071);
    var hi1 = bq("highpass", 4500, 0.7071), hi2 = bq("highpass", 4500, 0.7071);
    var ds = dyn(-54, 6, 3.5, 0.001, 0.05);
    var sum = ctx.createGain();
    var cp = dyn(-24, 20, 2.5, 0.01, 0.25);        // iguala el volumen con suavidad
    var makeup = ctx.createGain(); makeup.gain.value = 2.5;   // volumen general
    var lm = dyn(-3, 0, 20, 0.002, 0.1);           // freno final de picos
    var dest = ctx.createMediaStreamDestination();
    try{ dest.channelCount = 1; }catch(e){}
    src.connect(hp); hp.connect(lev); hp.connect(an); lev.connect(low); low.connect(pres); pres.connect(lp);
    lp.connect(dl); dl.connect(lo1); lo1.connect(lo2); lo2.connect(sum);
    lp.connect(hi1); hi1.connect(hi2); hi2.connect(ds.input); ds.output.connect(sum);
    sum.connect(cp.input); cp.output.connect(makeup); makeup.connect(lm.input); lm.output.connect(dest);
    // Nivelador automático: mide el volumen medio de la voz (ignorando las
    // pausas) y ajusta poco a poco la ganancia para que la grabación salga
    // siempre al mismo nivel, hables más cerca o más lejos del micrófono.
    var buf = new Float32Array(an.fftSize), levelDb = null, gainDb = 0, warm = 0;
    var TARGET_DB = -26, GATE_DB = -50, MIN_GAIN = -8, MAX_GAIN = 24;
    var timer = setInterval(function(){
      if(ctx.state === "closed"){ clearInterval(timer); return; }
      an.getFloatTimeDomainData(buf);
      var sum = 0;
      for(var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      var db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);
      if(db < GATE_DB) return;                       // pausa: no se toca el nivel
      warm++;
      levelDb = (levelDb === null) ? db : levelDb + (db - levelDb) * (warm < 25 ? 0.25 : 0.05);
      var want = Math.max(MIN_GAIN, Math.min(MAX_GAIN, TARGET_DB - levelDb));
      gainDb += (want - gainDb) * 0.3;
      lev.gain.setTargetAtTime(Math.pow(10, gainDb / 20), ctx.currentTime, 0.25);
    }, 40);
    return dest.stream;
  }

  // Carácter invisible (espacio de ancho cero): da al cursor un sitio donde
  // vivir justo debajo de un reproductor. Los navegadores no dejan poner el
  // cursor pegado detrás de un bloque no editable, y por eso antes el texto
  // se escribía siempre por encima. Se quita del texto plano al guardar.
  var ZW = "\u200B";

  function insertAudioClip(id, duration){
    var clip = document.createElement("div");
    clip.setAttribute("data-audio-id", id);
    clip.setAttribute("data-duration", String(Math.round(duration * 10) / 10));
    buildAudioClip(clip);
    bodyInput.focus();
    var sel = window.getSelection();
    sel.removeAllRanges();
    if(rec.range){
      sel.addRange(rec.range);
    } else {
      var r = document.createRange();
      r.selectNodeContents(bodyInput);
      r.collapse(false);
      sel.addRange(r);
    }
    var range = sel.getRangeAt(0);
    range.deleteContents();

    // se coloca pegado a ese (sin dejar una línea vacía entre los dos).
    var sc = range.startContainer;

      if(err && (err.name === "NotAllowedError" || err.name === "SecurityError")) throw err;

  fmtAudioBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); });

  // ── AUTO-ENLACE DE URLS Y CORREOS ──
  var LINK_RE = /((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]]|[\w.+-]+@[\w-]+\.[\w.-]+)/g;
  function linkifyHtml(escapedText){
    return escapedText.replace(LINK_RE, function(match){
      if(match.indexOf("@") !== -1 && match.indexOf("http") !== 0 && match.indexOf("www.") !== 0){
        return '<a href="mailto:' + match + '" contenteditable="false">' + match + '</a>';
      }
      var href = match.indexOf("http") === 0 ? match : "https://" + match;
      return '<a href="' + href + '" target="_blank" rel="noopener" contenteditable="false">' + match + '</a>';

  function getBodyText(){

    // que crea el teclado (ya sean <br>, párrafos <div>, o "\n" sueltos).

    // párrafos con punto y aparte aparecían todos seguidos.
    return (bodyInput.innerText || "").replace(/\u200B/g, "");

  function relinkifyBodyNow(){

    // enlaces las URLs/correos que encuentre, sin tocar el resto del DOM.
    var walker = document.createTreeWalker(bodyInput, NodeFilter.SHOW_TEXT, {

      }
    });
    var textNodes = [];
    var n;
    while(n = walker.nextNode()) textNodes.push(n);
    textNodes.forEach(function(node){
      var text = node.nodeValue;
      LINK_RE.lastIndex = 0;
      if(!LINK_RE.test(text)) return;
      LINK_RE.lastIndex = 0;
      var frag = document.createDocumentFragment();
      var lastIndex = 0;
      var match;
      while((match = LINK_RE.exec(text))){
        if(match.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        var m = match[0];
        var a = document.createElement("a");
        a.setAttribute("contenteditable", "false");
        if(m.indexOf("@") !== -1 && m.indexOf("http") !== 0 && m.indexOf("www.") !== 0){
          a.href = "mailto:" + m;
        } else {
          a.href = m.indexOf("http") === 0 ? m : "https://" + m;
          a.target = "_blank"; a.rel = "noopener";
        }
        a.textContent = m;
        frag.appendChild(a);
        lastIndex = match.index + m.length;
      }
      if(lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(frag, node);
    });
  }
  // ── BLOQUES DE PÁRRAFO ──
  // Cada párrafo es un <div class="p">; el estilo (checklist/viñeta/número)
  // va en data-t y la alineación en data-a. Enter crea un bloque nuevo que
  // hereda ambos; Mayús+Enter es un salto de línea dentro del mismo párrafo.
  function isBlockEl(n){
    return n.nodeType === 1 && (n.tagName === "DIV" || n.tagName === "IMG" || n.tagName === "FIGURE" || n.classList.contains("audio-clip"));
  }
  function isPlainBlock(n){
    return n && n.nodeType === 1 && n.tagName === "DIV" && !n.classList.contains("audio-clip");
  }
  function topBlock(node){
    while(node && node !== bodyInput && node.parentNode !== bodyInput) node = node.parentNode;
    return (node && node !== bodyInput && node.nodeType === 1) ? node : null;
  }
  function newBlock(){
    var d = document.createElement("div");
    d.className = "p";
    return d;
  }
  function blockIsEmpty(blk){
    return !blk.textContent.replace(/\u200B/g, "") && !blk.querySelector("img,.audio-clip");
  }
  function placeCaret(node, offset){
    var r = document.createRange();
    r.setStart(node, offset); r.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }
  // Cada imagen vive en su propio bloque (<figure>), nunca dentro de un párrafo,
  // y siempre hay un párrafo editable debajo. Así el cursor no se queda pegado
  // a la foto, ni a su izquierda, ni arriba al tocar debajo de ella.
  function makeImgFigure(img){
    var fig = document.createElement("figure");
    fig.className = "img-fig";
    fig.setAttribute("contenteditable", "false");
    if(img.parentNode) img.parentNode.insertBefore(fig, img);
    fig.appendChild(img);
    return fig;
  }
  function insertAfterNode(ref, node){ ref.parentNode.insertBefore(node, ref.nextSibling); }
  function ensureTrailingBlock(){
    var last = bodyInput.lastChild;
    if(last && last.nodeType === 1 && (last.tagName === "FIGURE" || last.tagName === "IMG")){
      var nb = newBlock(); nb.innerHTML = "<br>"; bodyInput.appendChild(nb);
    }
  }
  // Notas antiguas: imágenes sueltas o metidas dentro de un párrafo → cada una en su bloque
  function normalizeImages(){
    Array.prototype.slice.call(bodyInput.querySelectorAll("img")).forEach(function(img){
      if(img.closest("figure.img-fig")) return;
      var blk = topBlock(img);
      if(!blk) return;
      if(blk === img){ makeImgFigure(img); return; }       // imagen suelta en el nivel superior
      var fig = document.createElement("figure");
      fig.className = "img-fig"; fig.setAttribute("contenteditable", "false");
      var tailRange = document.createRange();
      tailRange.setStartAfter(img);
      tailRange.setEnd(blk, blk.childNodes.length);
      var after = newBlock();
      if(blk.getAttribute("data-t")) after.setAttribute("data-t", blk.getAttribute("data-t"));
      if(blk.getAttribute("data-a")) after.setAttribute("data-a", blk.getAttribute("data-a"));
      after.appendChild(tailRange.extractContents());
      fig.appendChild(img);
      insertAfterNode(blk, fig);
      insertAfterNode(fig, after);
      if(blockIsEmpty(after) && !after.querySelector("br")){ after.innerHTML = "<br>"; after.removeAttribute("data-t"); }
      if(!blk.textContent.replace(/\u200B/g, "") && !blk.querySelector("img,.audio-clip")) blk.parentNode.removeChild(blk);
    });
    ensureTrailingBlock();
  }
  // Envuelve en bloques cualquier texto/inline suelto en el nivel superior
  // (lo que el teclado escribe cuando la nota está vacía, o un pegado).
  function wrapLoose(){
    var sel = window.getSelection();
    var r = (sel && sel.rangeCount && bodyInput.contains(sel.anchorNode)) ? sel.getRangeAt(0) : null;
    var sc = r && r.startContainer, so = r && r.startOffset, ec = r && r.endContainer, eo = r && r.endOffset;
    var cur = null, changed = false;
    Array.prototype.slice.call(bodyInput.childNodes).forEach(function(n){
      if(n.nodeType === 1 && n.classList.contains("p-break-spacer")){ bodyInput.removeChild(n); cur = null; changed = true; return; }
      if(isBlockEl(n)){
        cur = null;
        if(isPlainBlock(n) && !n.classList.contains("p")) n.classList.add("p");
        return;
      }
      if(!cur){ cur = newBlock(); bodyInput.insertBefore(cur, n); }
      cur.appendChild(n); changed = true;
    });
    if(changed && r){
      try{
        var nr = document.createRange();
        nr.setStart(sc, so); nr.setEnd(ec, eo);
        sel.removeAllRanges(); sel.addRange(nr);
      }catch(err){}
    }
    ensureTrailingBlock();
  }
  function scrollBlockIntoView(el){
    requestAnimationFrame(function(){
      var rect = el.getBoundingClientRect();
      var boxRect = bodyInput.getBoundingClientRect();
      if(rect.bottom > boxRect.bottom - 4) bodyInput.scrollTop += (rect.bottom - boxRect.bottom) + 40;
    });
  }
  bodyInput.addEventListener("keydown", function(e){
    var sel = window.getSelection();
    if(e.key === "Backspace" && sel && sel.rangeCount && sel.isCollapsed){
      // Backspace al inicio de un párrafo con estilo: quita el estilo primero.
      var bk = topBlock(sel.anchorNode);
      if(bk && bk.getAttribute("data-t")){
        var pre = document.createRange();
        pre.selectNodeContents(bk);
        pre.setEnd(sel.anchorNode, sel.anchorOffset);
        if(!pre.toString().replace(/\u200B/g, "") && !pre.cloneContents().querySelector("img,.audio-clip")){
          e.preventDefault();
          bk.removeAttribute("data-t"); bk.removeAttribute("data-done");
          refreshBlockButtons();
          return;
        }
      }
    }
    if(e.key !== "Enter") return;
    e.preventDefault();
    if(e.shiftKey){ document.execCommand("insertLineBreak"); return; }
    wrapLoose();
    if(!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    range.deleteContents();
    var blk = topBlock(range.startContainer);
    var nb = newBlock();
    if(!blk || !isPlainBlock(blk) || blk.classList.contains("audio-clip")){
      nb.innerHTML = "<br>";
      if(blk) blk.parentNode.insertBefore(nb, blk.nextSibling); else bodyInput.appendChild(nb);
      placeCaret(nb, 0); scrollBlockIntoView(nb);
      return;
    }
    if(blk.getAttribute("data-t") && blockIsEmpty(blk)){
      // Enter en un elemento de lista vacío: sale de la lista.
      blk.removeAttribute("data-t"); blk.removeAttribute("data-done");
      refreshBlockButtons();
      return;
    }
    var tail = document.createRange();
    tail.selectNodeContents(blk);
    tail.setStart(range.startContainer, range.startOffset);
    nb.appendChild(tail.extractContents());
    if(blk.getAttribute("data-t")) nb.setAttribute("data-t", blk.getAttribute("data-t"));
    if(blk.getAttribute("data-a")) nb.setAttribute("data-a", blk.getAttribute("data-a"));
    if(blockIsEmpty(nb)) nb.innerHTML = "<br>";
    if(blockIsEmpty(blk) && !blk.querySelector("br")) blk.innerHTML = "<br>";
    blk.parentNode.insertBefore(nb, blk.nextSibling);
    placeCaret(nb, 0); scrollBlockIntoView(nb);
    refreshBlockButtons();
  });
  // Tocar la casilla de una tarea la marca/desmarca.
  bodyInput.addEventListener("click", function(e){
    var blk = topBlock(e.target);
    if(blk && blk.getAttribute("data-t") === "check" && e.clientX - blk.getBoundingClientRect().left < 30){
      e.preventDefault();
      if(blk.hasAttribute("data-done")) blk.removeAttribute("data-done"); else blk.setAttribute("data-done", "1");
    }
  });
  // Si el usuario borra todo el contenido, algunos navegadores dejan un <br> suelto;
  // lo limpiamos para que vuelva a verse el placeholder.
  bodyInput.addEventListener("input", function(){
    var h = bodyInput.innerHTML;
    if(h === "<br>" || h === "<div><br></div>" || h === '<div class="p"><br></div>'){
      bodyInput.innerHTML = "";
      return;
    }
    wrapLoose();
  });
  bodyInput.addEventListener("blur", relinkifyBodyNow);

  // ── EDITOR ──
  var editingNoteId = null;
  var editorHistoryPushed = false;
  var ignoreNextPop = false;
  var editingFolderId = null;
  var originalFolderId = null;
  var originalTitle = "";
  var originalBody = "";
  var originalBodyHtml = "";

  function openEditor(noteId){
    pendingFeature = null;
    stopAudioPlayback();
    editingNoteId = noteId || null;
    featPinSession = !!(noteId && data.featuredId === noteId);
    updateEditorPin();
    var note = noteId ? data.notes.find(function(n){ return n.id === noteId; }) : null;

    if(note){
      titleInput.textContent = note.title || "";
      if(note.bodyHtml){
        // Nota ya guardada con formato (negrita/cursiva/subrayado): se
        // restaura el HTML tal cual, tal y como se guardó.
        bodyInput.innerHTML = note.bodyHtml;
        hydrateAudioClips(bodyInput);
        wrapLoose();
        normalizeImages();
      } else {
        setBodyText(note.body || "");
      }
      dateDisplay.textContent = formatDate(note.updatedAt);
      dateDisplay.classList.remove("hidden");
      editingFolderId = note.folderId;
      originalFolderId = note.folderId;
      originalTitle = note.title || "";
      originalBody = note.body || "";
      originalBodyHtml = getBodyHTML();
    } else {
      titleInput.textContent = "";
      setBodyText("");
      dateDisplay.textContent = "";
      dateDisplay.classList.add("hidden");
      editingFolderId = currentFolder().id;
      originalFolderId = null;
      originalTitle = "";
      originalBody = "";
      originalBodyHtml = "";
    }

    screenList.classList.add("hidden");
    screenEditor.classList.remove("hidden");
    history.pushState({nm:1}, "");
    editorHistoryPushed = true;
    if(!note){
      // Nota nueva: el cursor va directo al cuerpo y se abre el teclado.
      setTimeout(function(){ bodyInput.focus(); }, 50);
    }
    // Nota ya existente: no se enfoca nada a propósito, para que se abra
    // sin teclado y sin el cursor parpadeando en ningún sitio.
  }

  function hasContent(){
    // getBodyText() (innerText) no cuenta una imagen como contenido, así que
    // se comprueba también si hay alguna <img> en el cuerpo.
    return !!(titleInput.textContent.trim() || getBodyText().trim() || bodyInput.querySelector("img") || bodyInput.querySelector(".audio-clip"));
  }

  function closeEditorToList(){
    stopAudioPlayback();
    if(editorHistoryPushed){
      editorHistoryPushed = false;
      ignoreNextPop = true;
      history.back();
    }
    screenEditor.classList.add("hidden");
    screenList.classList.remove("hidden");
    renderList();
  }

  function commitSave(folderId, showFolder){
    var now = Date.now();
    var bodyText = getBodyText();
    var bodyHtml = getBodyHTML();
    if(editingNoteId){
      var note = data.notes.find(function(n){ return n.id === editingNoteId; });
      note.title = titleInput.textContent;
      note.body = bodyText;
      note.bodyHtml = bodyHtml;
      note.folderId = folderId;
      note.updatedAt = now;
    } else {
      var newNote = {
        id: uid(),
        folderId: folderId,
        title: titleInput.textContent,
        body: bodyText,
        bodyHtml: bodyHtml,
        createdAt: now,
        updatedAt: now
      };
      data.notes.push(newNote);
      editingNoteId = newNote.id;
    }
    if(pendingFeature === true) data.featuredId = editingNoteId;
    else if(pendingFeature === false && data.featuredId === editingNoteId) data.featuredId = null;
    pendingFeature = null;
    // Con "Mover a...", tras guardar se abre la lista de la carpeta elegida;
    // con Guardar normal se vuelve a la lista donde estábamos.
    if(showFolder) data.currentFolderId = folderId;
    saveData();
    closeEditorToList();
  }

  // ── GUARDAR Y SALIR ──
  // Guardar (desde el menú de la N o desde el aviso de salida): sin elegir
  // carpeta. Una nota existente se queda en su carpeta; una nota nueva se
  // guarda en la carpeta en la que se está creando. Después se vuelve a la
  // lista donde estábamos.
  function saveDirect(){
    if(!hasContent()){
      closeEditorToList();
      return;
    }
    commitSave(editingNoteId ? originalFolderId : editingFolderId);
  }

  // ── MOVER A... (carpetas: "Todas" primero y el resto en orden alfabético) ──
  var modalMove = document.getElementById("modal-move");

  var moveNewInput = document.getElementById("move-new-input");

  function sortedFolders(){
    var others = data.folders.filter(function(f){ return !f.isAll; }).sort(function(a, b){
      return a.name.localeCompare(b.name, "es", {sensitivity:"base"});
    });
    return [getAllFolder()].concat(others);
  }

  function renderMoveChips(){
    moveChips.innerHTML = "";
    sortedFolders().forEach(function(f){
      var chip = document.createElement("div");
      chip.className = "folder-chip" + (f.id === editingFolderId ? " active" : "");
      chip.innerHTML = '<span class="chip-name">' + escapeHtml(f.name) + '</span>';
      chip.addEventListener("click", function(){
        modalMove.classList.add("hidden");
        if(!hasContent()){ closeEditorToList(); return; }
        commitSave(f.id, true);
      });
      moveChips.appendChild(chip);
    });

  function openMovePick(){

    renderMoveChips();

  // Salir con la flecha o con el gesto/botón de retroceso del móvil: si hay
  // cambios, aviso para guardar; si no, se sale directamente.
  function requestExit(){
    if(recordingActive) return; // no salir de la nota mientras se graba
    var changed = titleInput.textContent !== originalTitle || getBodyText() !== originalBody || getBodyHTML() !== originalBodyHtml;
    if(changed && hasContent()){
      modalSavePick.classList.remove("hidden");
    } else {
      closeEditorToList();
    }
  }
  document.getElementById("btn-back").addEventListener("click", requestExit);

  // Historial: al abrir el editor se añade una entrada, para que el gesto de
  // retroceso del móvil (deslizar desde el borde) haga lo mismo que la flecha
  // en vez de sacarte de la app.
  window.addEventListener("popstate", function(){
    if(ignoreNextPop){ ignoreNextPop = false; return; }
    if(drawBackHook && drawBackHook()){ history.pushState({nm:1}, ""); return; }
    if(screenEditor.classList.contains("hidden")) return;
    editorHistoryPushed = false;
    // La entrada ya se consumió: se repone por si hay que quedarse en la nota.
    history.pushState({nm:1}, "");
    editorHistoryPushed = true;
    requestExit();
  });

  // ── UTILIDAD: DESCARGAR UN ARCHIVO DESDE EL NAVEGADOR ──
  function downloadFile(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
  function safeFileName(s){
    return (s || "nota").trim().replace(/[\\/:*?"<>|]+/g, "-").slice(0, 60) || "nota";
  }

  function openSearch(){

  function renderSearchResults(query){
    searchResults.innerHTML = "";
    var words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(words.length === 0){
      searchResults.innerHTML = '<div style="padding:12px 4px;color:var(--text-muted);font-size:15px;">Escribe para buscar en todas las notas.</div>';
      return;
    }
    var matches = data.notes.filter(function(n){
      var haystack = ((n.title || "") + " " + (n.body || "")).toLowerCase();
      return words.every(function(w){ return haystack.indexOf(w) !== -1; });
    }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });

    if(matches.length === 0){
      searchResults.innerHTML = '<div style="padding:12px 4px;color:var(--text-muted);font-size:15px;">Sin resultados.</div>';
      return;
    }
    matches.forEach(function(n){
      var folder = getFolder(n.folderId);
      var row = document.createElement("div");
      row.className = "search-result";
      var title = n.title && n.title.trim() ? n.title : "Sin título";
      row.innerHTML =
        '<div class="search-result-title">' + escapeHtml(title) + '</div>' +
        '<div class="search-result-folder">' + escapeHtml(folder ? folder.name : "") + '</div>';
      row.addEventListener("click", function(){
        modalSearch.classList.add("hidden");
        data.currentFolderId = n.folderId;
        saveData();
        openEditor(n.id);
      });
      searchResults.appendChild(row);
    });
  }
