<style>
:root{
  --bg:#faf9f5;
  --topbar-dark:#f0ede8;
  --tab-shadow: rgba(112,103,81,0.38);
  --white:#ffffff;
  --text:#242320;
  --text-muted:#9a9384;
  --date:#3b7dd8;
  --border:#e5e0d3;
  --shadow: 6px 8px 22px rgba(60,50,30,0.14);
  --shadow-soft: 3px 5px 10px rgba(60,50,30,0.22);
  --radius:16px;
  --topbar-h:58px;
  --tab-top-margin:9px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  overflow:hidden;
  font-size:15px;
}
img{-webkit-user-drag:none;user-select:none;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg);
}
.hidden{display:none !important;}

/* ── TOPBAR (pantalla principal) ── */
#topbar-wrap{
  position:relative;
  flex-shrink:0;
}
#topbar{
  position:relative;
  background:var(--topbar-dark);
  height:calc(var(--topbar-h) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:flex-end;
  z-index:1;
}
#folder-tab-back{
  position:absolute;
  top:var(--tab-top-margin);
  left:0;
  width:calc(50% + 10px);
  height:calc(var(--topbar-h) - var(--tab-top-margin));
  background:var(--bg);
  border-radius:16px 16px 0 0;
  box-shadow: 5px 4px 10px var(--tab-shadow);
  z-index:0;
}
#folder-tab{
  width:50%;
  height:calc(var(--topbar-h) - var(--tab-top-margin));
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 14px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:18px;
  color:var(--text);
  overflow:hidden;
  border-radius:16px 16px 0 0;
  box-shadow: 6px 7px 14px var(--tab-shadow);
  position:relative;
  z-index:1;
}
#folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#folder-count{
  font-weight:400;
  font-size:16px;
  color:var(--text-muted);
  flex-shrink:0;
}
#seam-mask{
  position:absolute;
  left:0;bottom:0;
  width:50%;
  height:18px;
  background:var(--bg);
  z-index:2;
}
#topbar-actions{
  position:absolute;
  right:0;top:0;bottom:0;
  width:50%;
  display:flex;align-items:center;justify-content:flex-start;
  gap:20px;
  padding:0 26px 0 34px;
  z-index:1;
}
#btn-menu{ margin-left:auto; }
.icon-btn{
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
#btn-plus{font-size:26px;font-weight:400;color:var(--text);line-height:1;width:30px;height:30px;}
#btn-folder img{
  height:26px;width:auto;
  display:block;
  filter:drop-shadow(2px 3px 2px var(--tab-shadow)) drop-shadow(2px 3px 2px var(--tab-shadow));
}
#btn-menu img{
  height:32px;width:auto;
  display:block;
  filter:drop-shadow(var(--shadow-soft));
}

/* ── LISTA DE NOTAS ── */
#notes-list{
  position:relative;
  z-index:3;
  background:var(--bg);
  flex:1;overflow-y:auto;
  padding:38px 20px 30px;
}
.note-card{
  padding:22px 2px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.note-card:last-child{border-bottom:none;}
.note-title{
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:17px;
  letter-spacing:normal;
  margin-bottom:8px;
  color:var(--text);
}
.note-body-row{
  display:flex;
  align-items:stretch;
  gap:12px;
}
.note-text-col{
  flex:1;
  min-width:0;
}
.note-thumb{
  /* El tamaño final (ancho=alto, igual a la altura del bloque de texto)
     se fija por JavaScript tras dibujar la lista — ver renderList(). Un
     cuadrado fijo aquí es solo el valor de respaldo por si esa medición
     fallara alguna vez. */
  width:84px;
  height:84px;
  object-fit:cover;
  border-radius:10px;
  flex-shrink:0;
}
.note-preview{
  font-size:16px;
  line-height:1.5;
  color:var(--text);
  white-space:pre-wrap;
  overflow:hidden;
  margin-bottom:10px;
}
.note-date{
  font-size:13px;
  color:var(--date);
}
.read-more{
  color:var(--text-muted);
  font-weight:600;
}
#empty-state{
  padding:60px 24px;
  text-align:center;
  color:var(--text-muted);
  font-size:15px;
  line-height:1.6;
}

/* ── EDITOR DE NOTA ── */
#editor-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  flex-shrink:0;
}
#btn-back{font-size:32px;color:var(--text);padding:6px 10px;margin-left:-10px;}
#editor-header-actions{display:flex;align-items:center;gap:16px;}
#editor-header-actions #btn-cancel{font-size:15px;color:var(--text-muted);}
#editor-header-actions #btn-save{font-size:15px;color:var(--date);font-weight:600;}
#editor-body-wrap{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
  padding:8px 26px calc(20px + env(safe-area-inset-bottom,0px));
}
#note-title-input{
  width:100%;flex-shrink:0;
  border:none;background:none;outline:none;
  font-family:'Lora',serif;
  font-size:23px;
  font-weight:600;
  color:var(--text);
  margin-bottom:8px;
}
#note-title-input:empty:before{content:attr(data-placeholder);color:var(--text-muted);}
#note-title-input::placeholder{color:var(--text-muted);font-weight:500;}
#note-date-display{
  font-family:'Lora',serif;
  font-size:14px;
  color:var(--text-muted);
  margin-bottom:24px;
  display:block;
  flex-shrink:0;
}
#note-body-input{
  width:100%;flex:1;min-height:0;
  overflow-y:auto;
  outline:none;
  white-space:pre-wrap;
  word-wrap:break-word;
  font-family:'DM Sans',sans-serif;
  font-size:19px;
  line-height:1.55;
  color:var(--text);
  padding-bottom:160px;
}
#note-body-input:empty:before{content:attr(data-placeholder);color:var(--text-muted);}
#note-body-input a{color:var(--date);text-decoration:underline;}
#note-body-input .p-break-spacer{
  /* Espacio extra de "punto y aparte": un bloque con altura fija en
     píxeles (no depende del tamaño de letra ni de cómo cada navegador
     calcule la altura de una línea vacía, así el resultado es siempre
     el mismo). El ajuste de línea dentro del mismo párrafo no lleva esto. */
  display:block;
  height:10px;
}
#note-body-input img{
  display:block;
  width:92%;
  margin:14px auto;
  border-radius:14px;
  border:none;
  outline:none;
  /* El largo máximo es el doble del ancho de la imagen (92% del ancho
     disponible, aprox. 100vw menos el padding lateral del editor).
     Si la foto es más larga, se recorta (object-fit:cover) en vez de
     encogerla o dejarla desproporcionada. */
  max-height:calc(1.84 * (100vw - 52px));
  object-fit:cover;
}

#editor-toolbar{
  flex-shrink:0;
  display:flex;align-items:center;gap:4px;
  padding:6px 20px calc(6px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
  background:var(--bg);
}
#editor-toolbar.hidden{display:none;}
#editor-toolbar .fmt-btn{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--text);
  border-radius:10px;
}
#editor-toolbar .fmt-btn.active{
  background:var(--topbar-dark);
  color:var(--date);
}

/* ── VENTANAS FLOTANTES (MODALES) ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(30,28,22,0.28);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  padding:24px;
}
.modal-box{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  width:100%;max-width:380px;
  padding:26px 24px;
  max-height:80vh;
  display:flex;flex-direction:column;
}
#modal-image-source .modal-box{
  width:150px;max-width:150px;
  padding:20px 14px;
}
#modal-image-source .menu-option{
  text-align:center;
}
.modal-title{
  font-family:'Lora',serif;
  font-size:19px;font-weight:600;
  margin-bottom:16px;
  color:var(--text);
}
.modal-subtitle{
  font-size:13px;color:var(--text-muted);
  margin:-8px 0 16px;line-height:1.5;
}
.new-folder-row{
  display:flex;gap:10px;margin-bottom:18px;flex-shrink:0;
}
.new-folder-input{
  flex:1;padding:11px 14px;
  border:1px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;color:var(--text);
}
.new-folder-input:focus{border-color:var(--date);}
.new-folder-add{
  background:var(--text);color:#fff;
  padding:0 18px;border-radius:10px;
  font-size:14px;font-weight:600;
}
.folder-chips{
  display:flex;flex-wrap:wrap;gap:10px;
  overflow-y:auto;
}
.folder-chip{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;
  border-radius:20px;
  background:var(--bg);
  border:1px solid var(--border);
  font-size:14px;color:var(--text);
  cursor:pointer;
}
.folder-chip.active{
  background:var(--topbar-dark);
  border-color:var(--topbar-dark);
  font-weight:600;
}
.folder-chip .chip-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-action{
  font-size:12px;color:var(--text-muted);
  padding:2px 4px;
}
.chip-action:hover{color:var(--text);}
.modal-actions-row{
  margin-top:20px;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.modal-link-btn{
  font-size:14px;color:var(--text-muted);font-weight:600;
}
.menu-option{
  padding:13px 6px;
  font-size:15px;
  color:var(--text);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  text-align:left;
}
.menu-option:last-child{border-bottom:none;}
.menu-option.danger{color:#b5473a;}
.search-result{
  padding:12px 4px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.search-result:last-child{border-bottom:none;}
.search-result-title{font-weight:700;font-size:15px;color:var(--text);}
.search-result-folder{font-size:12px;color:var(--text-muted);margin-top:2px;}
</style>
</head>

<script>
(function(){
  "use strict";


  var STORAGE_KEY = "onlyNotesData";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ── ALMACENAMIENTO: IndexedDB (antes localStorage) ──
  // Se guarda todo el objeto de datos bajo una única clave, igual que antes
  // en localStorage, pero en una base de datos con mucho más espacio, para
  // poder incrustar imágenes y audio en las notas.
  var IDB_NAME = "NotematicDB";
  var IDB_STORE = "kv";
  var idbPromise = null;
  function openIDB(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e.target.error); };
    });
    return idbPromise;
  }
  function idbGet(key){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbSet(key, value){
    return openIDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function defaultData(){
    var defaultFolders = [
      {id: uid(), name: "Notas", isAll: true},
      {id: uid(), name: "Carpeta 1"}
    ];
    return {
      folders: defaultFolders,
      notes: [],
      currentFolderId: defaultFolders[0].id
    };
  }

  // Devuelve una Promise con los datos: primero mira en IndexedDB; si está
  // vacía (primera vez tras la actualización), migra lo que hubiera en
  // localStorage; si tampoco hay nada, crea los datos por defecto.
  function loadData(){
    return idbGet(STORAGE_KEY).then(function(fromDB){
      if(fromDB){
        if(!fromDB.folders.some(function(f){ return f.isAll; })){
          fromDB.folders[0].isAll = true;
        }
        return fromDB;
      }
      var raw = null;
      try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
      if(raw){
        try{
          var parsed = JSON.parse(raw);
          if(!parsed.folders.some(function(f){ return f.isAll; })){
            parsed.folders[0].isAll = true;
          }
          return idbSet(STORAGE_KEY, parsed).then(function(){ return parsed; });
        }catch(e){}
      }
      var fresh = defaultData();
      return idbSet(STORAGE_KEY, fresh).then(function(){ return fresh; });
    });
  }

  function getFolder(id){

  function notesInFolder(folder){
    var list = folder.isAll
      ? data.notes.slice()
      : data.notes.filter(function(n){ return n.folderId === folder.id; });
    return list.sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  }

  function formatDate(ts){
    var d = new Date(ts);
    var meses = ["ene.","feb.","mar.","abr.","may.","jun.","jul.","ago.","sept.","oct.","nov.","dic."];

  function escapeHtml(s){

  function renderList(){
    var folder = currentFolder();

    folderNameEl.textContent = folder.name;

    notesListEl.innerHTML = "";
    if(notes.length === 0){
      var empty = document.createElement("div");
      empty.id = "empty-state";
      empty.textContent = "No hay notas en esta carpeta todavía. Pulsa + para crear la primera.";
      notesListEl.appendChild(empty);
      return;
    }
    notes.forEach(function(note){
      var card = document.createElement("div");
      card.className = "note-card";
      var title = note.title && note.title.trim() ? note.title : "Sin título";
      var rawPreview = (note.body || "").trim();
      var flatPreview = rawPreview.replace(/\s+/g, " ");
      var CHAR_LIMIT = 118;
      var isLong = flatPreview.length > CHAR_LIMIT;
      var previewHtml;
      if(isLong){
        var cut = flatPreview.slice(0, CHAR_LIMIT);
        var lastSpace = cut.lastIndexOf(" ");
        if(lastSpace > 60) cut = cut.slice(0, lastSpace);
        previewHtml = escapeHtml(cut) + '… <span class="read-more">Leer más</span>';
      } else {
        previewHtml = escapeHtml(flatPreview);
      }
      var thumbMatch = note.bodyHtml ? note.bodyHtml.match(/<img[^>]+src="([^"]+)"/i) : null;
      var thumbHtml = thumbMatch ? '<img class="note-thumb" src="' + thumbMatch[1] + '" alt=""/>' : "";
      card.innerHTML =
        '<div class="note-title">' + escapeHtml(title) + '</div>' +
        '<div class="note-body-row">' +
          '<div class="note-text-col">' +
            '<div class="note-preview">' + previewHtml + '</div>' +
            '<div class="note-date">' + formatDate(note.updatedAt) + '</div>' +
          '</div>' +
          thumbHtml +
        '</div>';
      card.addEventListener("click", function(){
        if(window.__onlyNotesSuppressClick) return;
        openEditor(note.id);
      });
      notesListEl.appendChild(card);
    });

    // Fijar el tamaño real (cuadrado) de las miniaturas: se mide la altura
    // que ocupa el texto (vista previa + fecha) de cada tarjeta y se aplica
    // como ancho y alto de su miniatura, ya que depender solo de CSS
    // (aspect-ratio + stretch de flexbox) no daba un resultado fiable.
    requestAnimationFrame(function(){
      var thumbs = notesListEl.querySelectorAll(".note-thumb");
      for(var i = 0; i < thumbs.length; i++){
        var thumb = thumbs[i];
        var textCol = thumb.previousElementSibling;
        if(textCol){
          var h = textCol.offsetHeight;
          if(h > 0){
            thumb.style.width = h + "px";
            thumb.style.height = h + "px";
          }
        }
      }
    });
  }

  function insertImageFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      bodyInput.focus();
      var sel = window.getSelection();
      sel.removeAllRanges();
      if(savedBodyRange){
        sel.addRange(savedBodyRange);
      } else {
        var r = document.createRange();
        r.selectNodeContents(bodyInput);
        r.collapse(false);
        sel.addRange(r);
      }
      var img = document.createElement("img");
      img.src = reader.result;
      // contenteditable="false": evita que Chrome muestre el borde/tiradores
      // de selección y redimensionado nativos que aparecen en imágenes
      // insertadas dentro de un campo editable.
      img.setAttribute("contenteditable", "false");
      var range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(img);
      // Deja el cursor justo después de la imagen insertada
      range.setStartAfter(img);
      range.setEndAfter(img);
      sel.removeAllRanges();
      sel.addRange(range);
    };
    reader.onerror = function(){
      alert("No se pudo leer la imagen. Prueba con otra.");
    };
    reader.readAsDataURL(file);
  }

  // ── AUTO-ENLACE DE URLS Y CORREOS ──
  var LINK_RE = /((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]]|[\w.+-]+@[\w-]+\.[\w.-]+)/g;
  function linkifyHtml(escapedText){
    return escapedText.replace(LINK_RE, function(match){
      if(match.indexOf("@") !== -1 && match.indexOf("http") !== 0 && match.indexOf("www.") !== 0){
        return '<a href="mailto:' + match + '" contenteditable="false">' + match + '</a>';
      }
      var href = match.indexOf("http") === 0 ? match : "https://" + match;
      return '<a href="' + href + '" target="_blank" rel="noopener" contenteditable="false">' + match + '</a>';
    });
  }
  function getBodyText(){
    // innerText (no textContent) porque respeta los saltos de línea reales
    // que crea el teclado (ya sean <br>, párrafos <div>, o "\n" sueltos).
    // textContent los ignoraba y por eso, al guardar y reabrir, los
    // párrafos con punto y aparte aparecían todos seguidos.
    return bodyInput.innerText || "";
  }
  function setBodyText(text){
    bodyInput.innerHTML = text ? linkifyHtml(escapeHtml(text)) : "";
  }
  function relinkifyBodyNow(){
    // Ojo: NO reconstruir todo el HTML desde el texto plano (eso borraría
    // la negrita/cursiva/subrayado). Solo recorremos los nodos de texto
    // sueltos (los que no estén ya dentro de un enlace) y convertimos en
    // enlaces las URLs/correos que encuentre, sin tocar el resto del DOM.
    var walker = document.createTreeWalker(bodyInput, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node){
        var p = node.parentNode;
        while(p && p !== bodyInput){
          if(p.nodeName === "A") return NodeFilter.FILTER_REJECT;
          p = p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var textNodes = [];
    var n;
    while(n = walker.nextNode()) textNodes.push(n);
    textNodes.forEach(function(node){
      var text = node.nodeValue;
      LINK_RE.lastIndex = 0;
      if(!LINK_RE.test(text)) return;
      LINK_RE.lastIndex = 0;
      var frag = document.createDocumentFragment();
      var lastIndex = 0;
      var match;
      while((match = LINK_RE.exec(text))){
        if(match.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        var m = match[0];
        var a = document.createElement("a");
        a.setAttribute("contenteditable", "false");
        if(m.indexOf("@") !== -1 && m.indexOf("http") !== 0 && m.indexOf("www.") !== 0){
          a.href = "mailto:" + m;
        } else {
          a.href = m.indexOf("http") === 0 ? m : "https://" + m;
          a.target = "_blank"; a.rel = "noopener";
        }
        a.textContent = m;
        frag.appendChild(a);
        lastIndex = match.index + m.length;
      }
      if(lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(frag, node);
    });
  }
  // Tecla Enter: insertar un bloque "espaciador" con una altura fija en
  // píxeles (en vez de un <br> con letra pequeña: la altura de una línea
  // vacía basada en el tamaño de letra de un <br> no se calcula de forma
  // fiable en todos los navegadores). Al ser un bloque, ya separa el
  // párrafo por sí solo — no hace falta un <br> adicional.
  bodyInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      e.preventDefault();
      var sel = window.getSelection();
      var spacer = null;
      if(sel && sel.rangeCount){
        var range = sel.getRangeAt(0);
        range.deleteContents();
        spacer = document.createElement("div");
        spacer.className = "p-break-spacer";
        spacer.setAttribute("contenteditable", "false");
        range.insertNode(spacer);
        range.setStartAfter(spacer);
        range.setEndAfter(spacer);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      // Como el salto lo insertamos nosotros (en vez del Enter nativo del
      // teclado), el navegador no hace su scroll automático de "llevar el
      // cursor a la vista". Lo replicamos a mano, midiendo directamente el
      // elemento "spacer" que acabamos de insertar (en vez de la posición
      // del cursor): justo al lado de un elemento no editable, el navegador
      // a veces no puede calcular la posición del cursor y, si el punto y
      // aparte se inserta en medio del texto (no al final), esto hacía que
      // la pantalla saltara por error al final de toda la nota.
      requestAnimationFrame(function(){
        var rect = spacer ? spacer.getBoundingClientRect() : null;
        if(rect){
          var boxRect = bodyInput.getBoundingClientRect();
          if(rect.bottom > boxRect.bottom - 4){
            bodyInput.scrollTop += (rect.bottom - boxRect.bottom) + 40;
          }
        }
      });
    }
  });
  // Si el usuario borra todo el contenido, algunos navegadores dejan un <br> suelto;

  function openEditor(noteId){
    editingNoteId = noteId || null;
    var note = noteId ? data.notes.find(function(n){ return n.id === noteId; }) : null;

    if(note){
      titleInput.textContent = note.title || "";

    } else {
      titleInput.textContent = "";
      setBodyText("");
      dateDisplay.textContent = "";
      dateDisplay.classList.add("hidden");

      originalFolderId = null;
      originalTitle = "";

  });

  // ── UTILIDAD: DESCARGAR UN ARCHIVO DESDE EL NAVEGADOR ──
  function downloadFile(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
  function safeFileName(s){
    return (s || "nota").trim().replace(/[\\/:*?"<>|]+/g, "-").slice(0, 60) || "nota";
  }

  // ── MENÚ (icono cuaderno) ──
  var modalMenu = document.getElementById("modal-menu");
  var menuOptions = document.getElementById("menu-options");
  var menuContext = "list"; // "list" | "editor"

  function addMenuOption(label, handler, danger){
    var opt = document.createElement("div");
    opt.className = "menu-option" + (danger ? " danger" : "");
    opt.textContent = label;
    opt.addEventListener("click", function(){
      modalMenu.classList.add("hidden");
      handler();
    });
    menuOptions.appendChild(opt);
  }

  function openMenu(context){
    menuContext = context;
    menuOptions.innerHTML = "";
    if(context === "list"){
      addMenuOption("Buscar", openSearch);
      addMenuOption("Exportar todo (copia de seguridad)", exportAllNotes);
      addMenuOption("Importar copia de seguridad", function(){ document.getElementById("import-full-input").click(); });
      addMenuOption("Importar nota (.txt / .md)", function(){ document.getElementById("import-note-input").click(); });
    } else {
      addMenuOption("Compartir nota", shareCurrentNote);
      addMenuOption("Exportar esta nota", exportCurrentNote);
      addMenuOption("Duplicar nota", duplicateCurrentNote);
      addMenuOption("Eliminar nota", deleteCurrentNote, true);
    }
    modalMenu.classList.remove("hidden");
  }
  document.getElementById("btn-menu").addEventListener("click", function(){ openMenu("list"); });
  document.getElementById("btn-menu-editor").addEventListener("click", function(){ openMenu("editor"); });
  document.getElementById("menu-close").addEventListener("click", function(){
    modalMenu.classList.add("hidden");
  });

  // ── BUSCAR ──
  var modalSearch = document.getElementById("modal-search");
  var searchInput = document.getElementById("search-input");
  var searchResults = document.getElementById("search-results");

  function openSearch(){
    searchInput.value = "";
    renderSearchResults("");
    modalSearch.classList.remove("hidden");
    setTimeout(function(){ searchInput.focus(); }, 50);
  }
  function renderSearchResults(query){
    searchResults.innerHTML = "";
    var words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(words.length === 0){
      searchResults.innerHTML = '<div style="padding:12px 4px;color:var(--text-muted);font-size:14px;">Escribe para buscar en todas las notas.</div>';
      return;
    }
    var matches = data.notes.filter(function(n){
      var haystack = ((n.title || "") + " " + (n.body || "")).toLowerCase();
      return words.every(function(w){ return haystack.indexOf(w) !== -1; });
    }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });

    if(matches.length === 0){
      searchResults.innerHTML = '<div style="padding:12px 4px;color:var(--text-muted);font-size:14px;">Sin resultados.</div>';
      return;
    }
    matches.forEach(function(n){
      var folder = getFolder(n.folderId);
      var row = document.createElement("div");
      row.className = "search-result";
      var title = n.title && n.title.trim() ? n.title : "Sin título";
      row.innerHTML =
        '<div class="search-result-title">' + escapeHtml(title) + '</div>' +
        '<div class="search-result-folder">' + escapeHtml(folder ? folder.name : "") + '</div>';
      row.addEventListener("click", function(){
        modalSearch.classList.add("hidden");
        data.currentFolderId = n.folderId;
        saveData();
        openEditor(n.id);
      });
      searchResults.appendChild(row);
    });
  }
  searchInput.addEventListener("input", function(){ renderSearchResults(searchInput.value); });
  document.getElementById("search-close").addEventListener("click", function(){
    modalSearch.classList.add("hidden");
  });

  // ── EXPORTAR ──
  function exportAllNotes(){
    var payload = {
      app: "notematic",
      exportedAt: new Date().toISOString(),
      folders: data.folders,
      notes: data.notes
    };
    downloadFile("only-notes-copia-seguridad.json", JSON.stringify(payload, null, 2), "application/json");
  }
  function exportCurrentNote(){
    if(!editingNoteId){ alert("Guarda la nota antes de exportarla."); return; }
    var note = data.notes.find(function(n){ return n.id === editingNoteId; });
    if(!note) return;
    var title = note.title && note.title.trim() ? note.title : "Sin título";
    var content = title + "\n\n" + (note.body || "");
    downloadFile(safeFileName(title) + ".txt", content, "text/plain");
  }

  // ── IMPORTAR ──
  document.getElementById("import-full-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed.folders || !parsed.notes) throw new Error("formato");
        if(!confirm("Esto añadirá " + parsed.folders.length + " carpeta(s) y " + parsed.notes.length + " nota(s) a tu app. ¿Continuar?")) return;
        var idMap = {};
        parsed.folders.forEach(function(f){
          var newId = uid();
          idMap[f.id] = newId;
          data.folders.push({id: newId, name: f.name, isAll: false});
        });
        parsed.notes.forEach(function(n){
          data.notes.push({
            id: uid(),
            folderId: idMap[n.folderId] || getAllFolder().id,
            title: n.title || "",
            body: n.body || "",
            bodyHtml: n.bodyHtml || "",
            createdAt: n.createdAt || Date.now(),
            updatedAt: n.updatedAt || Date.now()
          });
        });
        saveData();
        renderList();
        alert("Importación completada.");
      }catch(err){
        alert("El archivo no tiene un formato válido de copia de seguridad de notematic.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("import-note-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = reader.result;
      var lines = text.split(/\r?\n/);
      var title = (lines[0] || file.name.replace(/\.[^.]+$/, "")).trim();
      var body = lines.slice(1).join("\n").replace(/^\s*\n/, "");
      var now = Date.now();
      data.notes.push({
        id: uid(),
        folderId: currentFolder().id,
        title: title,
        body: body,
        createdAt: now,
        updatedAt: now
      });
      saveData();
      renderList();
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ── COMPARTIR / DUPLICAR / ELIMINAR (nota actual en el editor) ──
  function shareCurrentNote(){
    var title = titleInput.textContent.trim() || "Sin título";
    var text = title + "\n\n" + getBodyText();
    if(navigator.share){
      navigator.share({title: title, text: text}).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        alert("Nota copiada al portapapeles.");
      }).catch(function(){
        alert("No se ha podido compartir ni copiar la nota.");
      });
    } else {
      alert("Tu navegador no permite compartir directamente. Copia el texto manualmente.");
    }
  }
  function duplicateCurrentNote(){
    if(!editingNoteId){ alert("Guarda la nota antes de duplicarla."); return; }
    var note = data.notes.find(function(n){ return n.id === editingNoteId; });
    if(!note) return;
    var now = Date.now();
    var copy = {
      id: uid(),
      folderId: note.folderId,
      title: (note.title && note.title.trim() ? note.title : "Sin título") + " (copia)",
      body: note.body,
      bodyHtml: note.bodyHtml,
      createdAt: now,
      updatedAt: now
    };
    data.notes.push(copy);
    saveData();
    openEditor(copy.id);
  }
  function deleteCurrentNote(){
    if(!editingNoteId){ closeEditorToList(); return; }
    if(!confirm("¿Eliminar esta nota? No se puede deshacer.")) return;
    data.notes = data.notes.filter(function(n){ return n.id !== editingNoteId; });
    saveData();
    closeEditorToList();
  }

  // ── GESTO: DESLIZAR PARA CAMBIAR DE CARPETA ──
  (function(){
    var startX = 0, startY = 0, tracking = false, isSwipeGesture = false;
    var SWIPE_THRESHOLD = 55;

    function goToAdjacentFolder(step){
      var idx = data.folders.findIndex(function(f){ return f.id === data.currentFolderId; });
      if(idx === -1) idx = 0;
      var next = (idx + step + data.folders.length) % data.folders.length;
      data.currentFolderId = data.folders[next].id;
      saveData();
      renderList();
    }

    notesListEl.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
      isSwipeGesture = false;
    }, {passive:true});

    notesListEl.addEventListener("touchmove", function(e){
      if(!tracking || !e.touches[0]) return;
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4){
        isSwipeGesture = true;
      }
    }, {passive:true});

    notesListEl.addEventListener("touchend", function(e){
      if(!tracking) return;
      tracking = false;
      var t = (e.changedTouches && e.changedTouches[0]) || null;
      if(!t) return;
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      if(isSwipeGesture && Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.4 && data.folders.length > 1){
        window.__onlyNotesSuppressClick = true;
        setTimeout(function(){ window.__onlyNotesSuppressClick = false; }, 400);
        goToAdjacentFolder(dx < 0 ? 1 : -1);
      }
    });
  })();

  // ── INICIO ──
  loadData().then(function(loaded){
    data = loaded;
    renderList();
  }).catch(function(e){
    console.error("Error cargando los datos guardados", e);
    alert("No se pudieron cargar tus notas guardadas. Prueba a recargar la app.");
  });
})();
</script>
</body>
</html>
