  // ── EXPORTAR ──
  function blobToDataURL(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
      r.readAsDataURL(blob);
    });
  }
  // Ids de las grabaciones que las notas guardadas tienen en su HTML
  function referencedAudioIds(withTrash){
    var ids = {};
    var all = data.notes.slice();
    if(withTrash) data.trash.forEach(function(e){ all.push(e.note); });
    all.forEach(function(n){
      var re = /data-audio-id="([^"]+)"/g, m;
      var html = n.bodyHtml || "";
      while((m = re.exec(html))) ids[m[1]] = true;
    });
    return ids;
  }
  function exportAllNotes(){
    var ids = Object.keys(referencedAudioIds());
    Promise.all(ids.map(function(id){
      return idbStoreGet(AUDIO_STORE, id).then(function(record){
        if(!record) return null;
        return blobToDataURL(record.blob).then(function(dataUrl){
          return {id: record.id, mime: record.mime, duration: record.duration, createdAt: record.createdAt, diag: record.diag || null, gainDb: (typeof record.gainDb === "number" ? record.gainDb : null), data: dataUrl};
        });
      });
    })).then(function(list){
      var payload = {
        app: "notematic",
        exportedAt: new Date().toISOString(),
        folders: data.folders,
        notes: data.notes,
        audios: list.filter(Boolean)
      };
      downloadFile("only-notes-copia-seguridad.json", JSON.stringify(payload, null, 2), "application/json");
    }).catch(function(){
      alert("No se pudo preparar la copia de seguridad.");
    });
  }
  function exportCurrentNote(){
    if(!editingNoteId){ alert("Guarda la nota antes de exportarla."); return; }
    var note = data.notes.find(function(n){ return n.id === editingNoteId; });
    if(!note) return;
    var title = note.title && note.title.trim() ? note.title : "Sin título";
    var content = title + "\n\n" + (note.body || "");
    downloadFile(safeFileName(title) + ".txt", content, "text/plain");
  }

  // ── IMPORTAR ──
  document.getElementById("import-full-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed.folders || !parsed.notes) throw new Error("formato");
        if(!confirm("Esto añadirá " + parsed.folders.length + " carpeta(s) y " + parsed.notes.length + " nota(s) a tu app. ¿Continuar?")) return;
        var idMap = {};
        parsed.folders.forEach(function(f){
          var newId = uid();
          idMap[f.id] = newId;
          data.folders.push({id: newId, name: f.name, isAll: false});
        });
        parsed.notes.forEach(function(n){
          data.notes.push({
            id: uid(),
            folderId: idMap[n.folderId] || getAllFolder().id,
            title: n.title || "",
            body: n.body || "",
            bodyHtml: n.bodyHtml || "",
            createdAt: n.createdAt || Date.now(),
            updatedAt: n.updatedAt || Date.now()
          });
        });
        saveData();
        renderList();
        var audios = Array.isArray(parsed.audios) ? parsed.audios : [];
        Promise.all(audios.map(function(a){
          return fetch(a.data).then(function(r){ return r.blob(); }).then(function(blob){
            return idbStorePut(AUDIO_STORE, a.id, {id: a.id, blob: blob, mime: a.mime, duration: a.duration, createdAt: a.createdAt || Date.now(), diag: a.diag || undefined, gainDb: (typeof a.gainDb === "number" ? a.gainDb : undefined)});
          });
        })).then(function(){
          alert("Importación completada.");
        }).catch(function(){
          alert("Importación completada, pero alguna grabación de voz no se pudo restaurar.");
        });
      }catch(err){
        alert("El archivo no tiene un formato válido de copia de seguridad de notematic.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("import-note-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = reader.result;
      var lines = text.split(/\r?\n/);
      var title = (lines[0] || file.name.replace(/\.[^.]+$/, "")).trim();
      var body = lines.slice(1).join("\n").replace(/^\s*\n/, "");
      var now = Date.now();
      data.notes.push({
        id: uid(),
        folderId: currentFolder().id,
        title: title,
        body: body,
        createdAt: now,
        updatedAt: now
      });
      saveData();
      renderList();
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ── COMPARTIR / DUPLICAR / ELIMINAR (nota actual en el editor) ──
  function shareCurrentNote(){
    var title = titleInput.textContent.trim() || "Sin título";
    var text = title + "\n\n" + getBodyText();
    if(navigator.share){
      navigator.share({title: title, text: text}).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        alert("Nota copiada al portapapeles.");
      }).catch(function(){
        alert("No se ha podido compartir ni copiar la nota.");
      });
    } else {
      alert("Tu navegador no permite compartir directamente. Copia el texto manualmente.");
    }
  }
  function duplicateCurrentNote(){
    if(!editingNoteId){ alert("Guarda la nota antes de duplicarla."); return; }
    var note = data.notes.find(function(n){ return n.id === editingNoteId; });
    if(!note) return;
    var now = Date.now();
    var copy = {
      id: uid(),
      folderId: note.folderId,
      title: (note.title && note.title.trim() ? note.title : "Sin título") + " (copia)",
      body: note.body,
      bodyHtml: note.bodyHtml,
      createdAt: now,
      updatedAt: now
    };
    data.notes.push(copy);
    saveData();
    openEditor(copy.id);
  }
  function deleteCurrentNote(){
    if(!editingNoteId){ closeEditorToList(); return; }
    var id = editingNoteId;
    var moved = moveNotesToTrash(function(n){ return n.id === id; });
    saveData();
    closeEditorToList();
    showToast("Nota movida a la papelera", "Deshacer", function(){ restoreTrashEntries(moved); });
  }

  // ── PAPELERA ──
  var TRASH_DAYS = 30, DAY_MS = 86400000;
  function moveNotesToTrash(pred){
    var moved = [];
    data.notes = data.notes.filter(function(n){
      if(!pred(n)) return true;
      var f = getFolder(n.folderId);
      var entry = {note: n, deletedAt: Date.now(), folderName: f ? f.name : "", wasFeatured: data.featuredId === n.id};
      if(entry.wasFeatured) data.featuredId = null;
      data.trash.push(entry);
      moved.push(entry);
      return false;
    });
    return moved;
  }
  function restoreTrashEntries(entries){
    entries.forEach(function(entry){
      var i = data.trash.indexOf(entry);
      if(i === -1) return;
      data.trash.splice(i, 1);
      var n = entry.note;
      if(!getFolder(n.folderId)) n.folderId = getAllFolder().id;
      data.notes.push(n);
      if(entry.wasFeatured && !hasFeaturedNote()) data.featuredId = n.id;
    });
    saveData();
    renderList();
    renderTrash();
  }
  function purgeExpiredTrash(){
    var cutoff = Date.now() - TRASH_DAYS * DAY_MS, before = data.trash.length;
    data.trash = data.trash.filter(function(e){ return e.deletedAt > cutoff; });
    if(data.trash.length !== before) saveData();
  }
  function cleanupUnusedAudios(){
    if(!screenEditor.classList.contains("hidden")) return;
    var used = referencedAudioIds(true);
    idbStoreKeys(AUDIO_STORE).then(function(keys){
      keys.forEach(function(k){ if(!used[k]) idbStoreDelete(AUDIO_STORE, k); });
    }).catch(function(){});
  }
  var modalTrash = document.getElementById("modal-trash");
  var trashList = document.getElementById("trash-list");
  function openTrash(){ renderTrash(); modalTrash.classList.remove("hidden"); }
  function renderTrash(){
    trashList.innerHTML = "";
    document.getElementById("trash-empty").style.visibility = data.trash.length ? "visible" : "hidden";
    if(!data.trash.length){
      trashList.innerHTML = '<div style="padding:12px 4px;color:var(--text-muted);font-size:15px;">La papelera está vacía.</div>';
      return;
    }
    data.trash.slice().sort(function(a,b){ return b.deletedAt - a.deletedAt; }).forEach(function(entry){
      var n = entry.note;
      var left = Math.max(1, Math.ceil((entry.deletedAt + TRASH_DAYS * DAY_MS - Date.now()) / DAY_MS));
      var title = n.title && n.title.trim() ? n.title : "Sin título";
      var row = document.createElement("div");
      row.className = "trash-row";
      row.innerHTML =
        '<div class="trash-title">' + escapeHtml(title) + '</div>' +
        '<div class="trash-meta">' + escapeHtml(entry.folderName || "") + (entry.folderName ? " · " : "") + 'se borra en ' + left + (left === 1 ? " día" : " días") + '</div>' +
        '<div class="trash-actions"><button class="trash-btn" data-a="restore">Restaurar</button><button class="trash-btn danger" data-a="delete">Eliminar ya</button></div>';
      row.querySelector('[data-a="restore"]').addEventListener("click", function(){
        restoreTrashEntries([entry]);
        showToast("Nota restaurada");
      });
      row.querySelector('[data-a="delete"]').addEventListener("click", function(){
        if(!confirm("¿Eliminar esta nota para siempre? No se puede deshacer.")) return;
        data.trash = data.trash.filter(function(e){ return e !== entry; });
        saveData(); renderTrash(); cleanupUnusedAudios();
      });
      trashList.appendChild(row);
    });
  }
  document.getElementById("trash-empty").addEventListener("click", function(){
    if(!data.trash.length) return;
    if(!confirm("¿Vaciar la papelera? Las notas se borrarán para siempre y no se podrán recuperar.")) return;
    data.trash = [];
    saveData(); renderTrash(); cleanupUnusedAudios();
  });
  document.getElementById("trash-close").addEventListener("click", function(){ modalTrash.classList.add("hidden"); });
  modalTrash.addEventListener("click", function(e){ if(e.target === modalTrash) modalTrash.classList.add("hidden"); });

  // ── CONTADOR DE PALABRAS (solo el texto de la nota: sin grabaciones ni imágenes) ──
  function showWordCount(){
    var clone = bodyInput.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll(".audio-clip"), function(el){ el.parentNode.removeChild(el); });
    Array.prototype.forEach.call(clone.querySelectorAll("br,.p,div"), function(el){ el.insertAdjacentText("afterend", "\n"); });
    var text = (clone.textContent || "").replace(/\u200b/g, "");
    var words = (text.match(/\S+/g) || []).length;
    var chars = text.replace(/[\r\n]+/g, " ").trim().length;
    showToast(words + (words === 1 ? " palabra" : " palabras") + " · " + chars + (chars === 1 ? " carácter" : " caracteres"));
  }

  // ── GESTO: DESLIZAR PARA CAMBIAR DE CARPETA ──
  (function(){
    var startX = 0, startY = 0, tracking = false, isSwipeGesture = false;
    var SWIPE_THRESHOLD = 55;

    function goToAdjacentFolder(step){
      var idx = data.folders.findIndex(function(f){ return f.id === data.currentFolderId; });
      if(idx === -1) idx = 0;
      var next = (idx + step + data.folders.length) % data.folders.length;
      data.currentFolderId = data.folders[next].id;
      saveData();
      renderList();
    }

    notesListEl.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
      isSwipeGesture = false;
    }, {passive:true});

    notesListEl.addEventListener("touchmove", function(e){
      if(!tracking || !e.touches[0]) return;
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4){
        isSwipeGesture = true;
      }
    }, {passive:true});

    notesListEl.addEventListener("touchend", function(e){
      if(!tracking) return;
      tracking = false;
      var t = (e.changedTouches && e.changedTouches[0]) || null;
      if(!t) return;
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      if(isSwipeGesture && Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.4 && data.folders.length > 1){
        window.__onlyNotesSuppressClick = true;
        setTimeout(function(){ window.__onlyNotesSuppressClick = false; }, 400);
        goToAdjacentFolder(dx < 0 ? 1 : -1);
      }
    });
  })();

  // ── INICIO ──
  loadData().then(function(loaded){
    data = loaded;
    if(!Array.isArray(data.trash)) data.trash = [];
    purgeExpiredTrash();
    renderList();
    // Borra grabaciones que ya no usa ninguna nota ni la papelera (p. ej. de
    // notas borradas para siempre o de grabaciones que se quitaron sin guardar).
    // Solo si no hay una nota abierta.
    setTimeout(cleanupUnusedAudios, 3000);
  }).catch(function(e){
    console.error("Error cargando los datos guardados", e);
    alert("No se pudieron cargar tus notas guardadas. Prueba a recargar la app.");
  });
})();
</script>
<div id="toast"><span id="toast-msg"></span><button id="toast-action" class="hidden"></button></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
